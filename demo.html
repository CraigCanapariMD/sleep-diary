        (c.settings.initials || "Unnamed child") + " ("+Object.keys(c.entries).length+" nights)"));
    });
    sel.append(el("option",{value:"__add__"},"+ Add another child…"));
    setup.append(el("label",null,"Child"), sel);
  }
  setup.append(
    el("label",null,"Child's initials (no full names — this keeps the diary private)"),
    el("input",{type:"text", maxlength:"6", value:cur().settings.initials||"",
      oninput:e=>{ cur().settings.initials = e.target.value.trim(); saveState(); $("#hdrSub").textContent = headerSub(); }}),
    el("label",null,"Child's age group (adds sleep-need comparison to the report)"),
    /* re-render so the "who fills this in" default follows the age group */
    el("select",{onchange:e=>{ cur().settings.ageBand = e.target.value; saveState(); renderDiary(); }},
      el("option",{value:""},"Not set — no comparison shown"),
      Object.keys(AGE_BANDS).map(k=>
        el("option",{value:k, ...(cur().settings.ageBand===k?{selected:""}:{})}, AGE_BANDS[k].label))),
    /* D1: asked once per diary, never per entry; the default follows the age group */
    el("label",null,"Who fills in this diary?"),
    el("select",{onchange:e=>{ cur().settings.reporter = e.target.value; saveState(); }},
      el("option",{value:"parent", ...(reporter()==="parent"?{selected:""}:{})},"A parent or caregiver"),
      el("option",{value:"teen", ...(reporter()==="teen"?{selected:""}:{})},"The teen (their own sleep)")),
    el("div",{class:"hint"},
      "Everything you enter is saved only on this phone, in this browser or app — it is never uploaded anywhere. That also means the diary won't appear if you open the link on another device or in a different browser: keep using the same one, and use the Share tab's backup to move or protect your data.")
  );
  if (IS_NATIVE){
    const r = state.meta.reminder;
    const timeInp = el("input",{type:"time", value:r.time||"07:00", style:"max-width:140px",
      oninput:ev=>{ r.time = ev.target.value || "07:00"; saveState(); if (r.enabled) applyReminder(); }});
    setup.append(
      el("label",null,"Daily reminder (a notification on this phone only)"),
      el("div",{style:"display:flex;gap:8px;align-items:center"},
        timeInp,
        el("button",{class: r.enabled ? "btn-primary" : "btn-secondary", style:"width:auto;flex:0 0 auto",
          onclick:async ev=>{
            r.enabled = !r.enabled; saveState();
            await applyReminder();
            renderDiary();
            if (r.enabled && state.meta.reminder.enabled) toast("Reminder set for "+clockFromHM(r.time||"07:00"));
          }}, r.enabled ? "Reminder on" : "Turn on"))
    );
  }
  if (ids.length > 1){
    setup.append(el("button",{class:"btn-danger",style:"margin-top:8px;padding-left:0",onclick:()=>{
      const c = cur();
      if (confirm("Remove "+(c.settings.initials||"this child")+" and their "+Object.keys(c.entries).length+" recorded nights from this device?")){
        delete state.children[state.activeChild];
        state.activeChild = Object.keys(state.children)[0];
        saveState(); render();
      }
    }},"Remove this child…"));
  }
  v.append(setup);

  /* active clinician plan (if any) */
  if (cur().plan) v.append(planCard());

  v.append(el("button",{class:"btn-primary",onclick:()=>{ editing="__new__"; renderDiary(); }},"+ Add last night"));

  /* missed nights */
  const missing = missingNights();
  if (missing.length){
    const mc = el("div",{class:"card",style:"margin-top:12px"});
    mc.append(el("h2",null,"Missing nights"));
    mc.append(el("div",{class:"hint",style:"margin:0"},
      missing.length + (missing.length===1?" night has":" nights have") +
      " no entry. Tap to fill in while you still remember — gaps also break the regularity index."));
    const chips = el("div",{class:"chips"});
    missing.slice(-7).forEach(d=>{
      chips.append(el("button",{onclick:()=>{ editing="__new__"; newEntryDate=d; renderDiary(); }},"+ "+fmtDate(d)));
    });
    if (missing.length > 7) chips.append(el("span",{class:"hint"},"…and "+(missing.length-7)+" more"));
    mc.append(chips);
    v.append(mc);
  }

  const list = el("div",{class:"card",style:"margin-top:12px"});
  list.append(el("h2",null,"Recorded nights"));
  const entries = sortedEntries().slice().reverse();
  if (!entries.length){
    list.append(el("div",{class:"empty"},"No nights yet. Each morning, tap “Add last night” — it takes about a minute."));
  } else {
    entries.forEach(e=>{
      const c = computeNight(e);
      const meta = c.valid
        ? clockFromHM(e.lightsOut)+" → "+clockFromHM(e.outOfBed)+" · slept "+dur(c.tst)
          + (c.nAw? " · "+c.nAw+" waking"+(c.nAw>1?"s":"") : "")
          + (e.naps && e.naps.length ? " · "+e.naps.length+" nap"+(e.naps.length>1?"s":"") : "")
        : "Incomplete entry";
      list.append(el("div",{class:"entry-row",onclick:()=>{ editing=e.date; renderDiary(); }},
        el("div",null, el("div",{class:"d"},"Night of "+fmtDate(e.date)), el("div",{class:"meta"},meta)),
        el("div",{class:"chev"},"›")
      ));
    });
  }
  v.append(list);
}

/* ---------- entry form ---------- */
function lastEntryBefore(dateIso){
  const prior = sortedEntries().filter(x=> x.date < dateIso);
  return prior.length ? prior[prior.length-1] : null;
}
function entryForm(existing, presetDate){
  const targetDate = presetDate || addDays(isoToday(), -1); // "last night" = yesterday
  /* Prefill a new entry from the most recent night — a far better prior
     than fixed defaults once the family has logged once. */
  const prev = existing ? null : lastEntryBefore(targetDate) ||
               (sortedEntries().length ? sortedEntries()[sortedEntries().length-1] : null);
  const e = existing ? JSON.parse(JSON.stringify(existing)) : {
    date: targetDate,
    lightsOut:"", onset:"", wake:"", outOfBed:"",
    awakenings:[], naps:[], notes:""
  };
  e.adherence = e.adherence || {};
  const teenBand = isTeenBand();
  const inputs = {};
  const touched = new Set(existing ? ['intoBed','lightsOut','onset','wake','outOfBed'].filter(k=>e[k]) : []);
  const card = el("div",{class:"card"});
  card.append(el("h2",null, existing? "Edit night" : "New night",
    el("span",{class:"big"},"Night of ", el("span",{id:"fDateLabel"}, fmtDate(e.date)))));

  const warn = el("div",{class:"warnmsg",id:"fWarn"});

  function timeField(labelTxt, key, opts){
    opts = opts||{};
    const defaultVal = (prev && prev[key]) || opts.defaultVal || "";
    if (!existing && !e[key] && defaultVal) e[key] = defaultVal;
    const inp = el("input",{type:"time", value:e[key]||"",
      oninput:ev=>{
        const was = e[key];
        e[key]=ev.target.value; touched.add(key);
        [].concat(opts.cascadeTo||[]).forEach(k=>{
          if (touched.has(k) || !inputs[k]) return;
          /* "got into bed" only follows lights out while the two still match —
             a different time carried over from the last entry is kept */
          if (k === "intoBed" && e.intoBed && e.intoBed !== was) return;
          e[k]=ev.target.value; inputs[k].value=ev.target.value;
        });
        refresh();
      }});
    inputs[key]=inp;
    const wrap = el("div",null, el("label",null,labelTxt), inp);
    if (opts.hint) wrap.append(el("div",{class:"hint"},opts.hint));
    return wrap;
  }
  function showWarnings(){
    const c = computeNight(e);
    warn.textContent = c.valid && c.warnings.length ? "Check times: " + c.warnings.join(" ") : "";
  }
  /* live one-row preview (same drawing as the Chart tab) + soft notes;
     redrawn on every change so an AM/PM slip is visible at once */
  const preview = el("div",{class:"night-preview"});
  const softBox = el("div",{"aria-live":"polite"});
  function refresh(){
    showWarnings();
    preview.innerHTML = "";
    if (e.lightsOut || e.onset || e.wake || e.outOfBed){
      preview.append(el("div",{class:"hint",style:"margin:0 0 2px"},"This night, noon to noon:"),
                     buildChartSVG([e], {preview:true}));
      if ((e.naps||[]).flatMap(napPieces).some(x=> x.prev))
        preview.append(el("div",{class:"hint",style:"margin:2px 0 0"},
          "Naps before noon happened before this row starts. The Chart tab shows them at the end of the night before."));
    }
    softBox.innerHTML = "";
    plausibilityNotes(e).forEach(t=> softBox.append(el("div",{class:"softnote"}, el("b",null,"Worth a look: "), t)));
  }

  card.append(
    el("label",null,"Date (the evening the night began)"),
    el("input",{type:"date", value:e.date, oninput:ev=>{ e.date=ev.target.value; $("#fDateLabel").textContent = e.date ? fmtDate(e.date) : ""; drawPlanStrip(); if (e.date) refresh(); }}));
  /* DOM append() coerces null to the string "null" — only add the hint when it exists */
  if (prev) card.append(el("div",{class:"hint"},"Times start from your last entry ("+fmtDate(prev.date)+") — adjust what changed."));

  /* clinician plan strip: that night's computed targets + checklist */
  const plan = cur().plan;
  const planBox = el("div");
  function drawPlanStrip(){
    planBox.innerHTML = "";
    if (!plan) return;
    const t = planTargets(plan, e.date);
    if (!t) return;
    const strip = el("div",{class:"plan-strip"});
    strip.append(el("div",{class:"pf"},"Plan · night "+t.n+" · from "+planWho(plan)));
    const bits=[];
    if (t.bed!=null)  bits.push("bedtime "+clockMin(t.bed));
    if (t.wake!=null) bits.push("wake "+clockMin(t.wake));
    if (bits.length) strip.append(el("div",{class:"pt"},"Target: "+bits.join(" · ")));
    /* the diary is filled in the next morning, so the checklist asks about
       last night in the past tense (ROADMAP 1.6) */
    if ((plan.checklist||[]).length)
      strip.append(el("div",{class:"hint",style:"margin-top:6px"},"Last night — check each one that happened:"));
    (plan.checklist||[]).forEach(it=>{
      const cb = el("input",{type:"checkbox", ...(e.adherence[it.id]?{checked:""}:{}),
        onchange:ev=>{ e.adherence[it.id]=ev.target.checked; }});
      strip.append(el("label",{class:"pl"}, cb, checklistPast(it.label)));
    });
    planBox.append(strip);
  }
  drawPlanStrip();
  card.append(planBox);
  const fLights = timeField("Lights out / put in bed","lightsOut",{defaultVal:"20:00",cascadeTo:["onset","intoBed"]});
  /* "Got into bed" (CSD Core #1) — teen age bands only; starts equal to
     lights out and follows it until the two are set apart */
  let fIntoBed = null;
  if (teenBand){
    if (!e.intoBed && !(prev && prev.intoBed)) e.intoBed = e.lightsOut || "";
    fIntoBed = timeField("Got into bed","intoBed",{hint:"Change this if it was before lights out."});
  }
  if (fIntoBed) card.append(fIntoBed);   /* append() would print a null */
  card.append(
    el("div",{class:"grid2"},
      fLights,
      timeField("Fell asleep (your best guess)","onset",{defaultVal:"20:00"}),
      timeField("Woke up for the day","wake",{defaultVal:"06:30",cascadeTo:"outOfBed"}),
      timeField("Out of bed / out of crib","outOfBed",{defaultVal:"06:30"})
    ),
    warn, preview, softBox
  );

  /* awakenings */
  const awBox = el("div");
  function awRow(a, idx){
    return el("div",{class:"sub-item"},
      el("button",{class:"btn-danger rm",onclick:()=>{ e.awakenings.splice(idx,1); redrawAw(); refresh(); }},"Remove"),
      el("div",{class:"grid2"},
        el("div",null, el("label",null,"Woke at"),
          el("input",{type:"time",value:a.time||"",oninput:ev=>{ a.time=ev.target.value; refresh(); }})),
        el("div",null, el("label",null,"Awake for (minutes)"),
          el("input",{type:"number",min:"0",step:"1",inputmode:"numeric",value:a.dur||"",oninput:ev=>{ a.dur=ev.target.value; refresh(); }}))
      ),
      el("label",null,"Did you go in / help?"),
      el("select",{onchange:ev=>a.help=ev.target.value},
        Object.keys(HELP_LABELS).map(k=> el("option",{value:k, ...(a.help===k?{selected:""}:{})}, HELP_LABELS[k])))
    );
  }
  function redrawAw(){
    awBox.innerHTML="";
    e.awakenings.forEach((a,i)=> awBox.append(awRow(a,i)));
  }
  redrawAw();
  card.append(
    el("label",{style:"margin-top:14px"},"Night awakenings"),
    awBox,
    el("button",{class:"btn-ghost",onclick:()=>{ e.awakenings.push({time:"",dur:"",help:"none"}); redrawAw(); }},"+ Add an awakening")
  );

  /* naps (during the day before this night) — start time + duration, the same
     shape as a night awakening; n.woke stays the stored end time so the chart,
     the report and the exports keep reading one field. */
  const napBox = el("div");
  function napRow(n, idx){
    const endHint = el("div",{class:"hint"});
    function showEnd(){
      endHint.textContent = n.woke ? "Woke at "+clockFromHM(n.woke) : "";
    }
    function setEnd(){
      n.woke = (n.asleep && n.dur !== "" && Number(n.dur) > 0) ? hmAdd(n.asleep, Number(n.dur)) : "";
      showEnd(); refresh();
    }
    showEnd();
    return el("div",{class:"sub-item"},
      el("button",{class:"btn-danger rm",onclick:()=>{ e.naps.splice(idx,1); redrawNaps(); refresh(); }},"Remove"),
      el("div",{class:"grid2"},
        el("div",null, el("label",null,"Fell asleep at"),
          el("input",{type:"time",value:n.asleep||"",oninput:ev=>{ n.asleep=ev.target.value; setEnd(); }})),
        el("div",null, el("label",null,"Slept for (minutes)"),
          el("input",{type:"number",min:"1",step:"1",inputmode:"numeric",value:napDur(n),oninput:ev=>{ n.dur=ev.target.value; setEnd(); }}))
      ),
      endHint
    );
  }
  /* one-tap answers for a child who usually naps: the usual nap(s), or
     "No nap". Nothing is filled in until tapped, and leaving it alone never
     blocks saving — the day is then stored as "not recorded", not zero. An
     entry made before this question existed is not re-asked on edit. */
  const habit = napHabit(e.date);
  const napAsk = existing ? !!existing.napAsked : habit.ask;
  const usualLeft = habit.usual.slice();
  const napChips = el("div",{class:"chips"});
  function redrawNaps(){
    napBox.innerHTML="";
    e.naps.forEach((n,i)=> napBox.append(napRow(n,i)));
    napChips.innerHTML = "";
    if (!napAsk) return;
    if (e.noNap && !e.naps.length){
      napChips.append(el("span",{class:"hint",style:"margin:0;align-self:center"},"No nap that day."),
        el("button",{type:"button",onclick:()=>{ delete e.noNap; redrawNaps(); }},"Undo"));
      return;
    }
    usualLeft.forEach((u,ui)=>{
      napChips.append(el("button",{type:"button",onclick:()=>{
        e.naps.push({ asleep:u.asleep, dur:u.dur, woke:u.woke });
        usualLeft.splice(ui,1); delete e.noNap; redrawNaps(); refresh();
      }},"+ Usual nap ("+clockFromHM(u.asleep)+", "+u.dur+" min)"));
    });
    if (!e.naps.length)
      napChips.append(el("button",{type:"button",onclick:()=>{ e.noNap = true; redrawNaps(); }},"No nap that day"));
  }
  redrawNaps();
  card.append(
    el("label",{style:"margin-top:14px"},"Naps that day (before this bedtime)"),
    napBox, napChips,
    el("button",{class:"btn-ghost",onclick:()=>{ e.naps.push({asleep:"",dur:"",woke:""}); delete e.noNap; redrawNaps(); }},
      napAsk && habit.usual.length ? "+ Add a different nap" : "+ Add a nap")
  );

  /* sleep quality — one optional tap (CSD Core #8 anchors, faces as in
     CBT-i Coach); tapping the chosen face again clears it */
  const qLabel = el("div",{class:"face-label","aria-live":"polite"});
  const faces = el("div",{class:"faces",role:"radiogroup","aria-label":qualityQuestion()});
  function drawFaces(){
    faces.innerHTML = "";
    QUALITY_LABELS.forEach((lab,i)=>{
      const q = i+1, on = e.quality === q;
      const b = el("button",{type:"button",role:"radio","aria-checked": on ? "true" : "false","aria-label":lab,title:lab,
        onclick:()=>{ if (e.quality === q) delete e.quality; else e.quality = q; drawFaces(); }});
      b.append(faceSVG(q));
      faces.append(b);
    });
    qLabel.textContent = e.quality ? QUALITY_LABELS[e.quality-1] : "";
  }
  drawFaces();
  card.append(
    el("label",{style:"margin-top:14px"}, qualityQuestion()+" (optional)"),
    faces, qLabel
  );

  card.append(
    el("label",{style:"margin-top:14px"},"Notes (illness, travel, anything unusual)"),
    el("textarea",{oninput:ev=>e.notes=ev.target.value}, e.notes||"")
  );

  const btns = el("div",{class:"btn-row"});
  btns.append(el("button",{class:"btn-secondary",onclick:()=>{ editing=null; renderDiary(); }},"Cancel"));
  if (existing) btns.append(el("button",{class:"btn-danger",onclick:()=>{
      if (confirm("Delete this night?")){ delete cur().entries[existing.date]; syncMarkDirty(existing.date); saveState(); syncFlush(); editing=null; renderDiary(); $("#hdrSub").textContent=headerSub(); }
    }},"Delete"));
  btns.append(el("button",{class:"btn-primary",onclick:()=>{
    if (!e.date){ toast("Pick a date"); return; }
    if (!(e.lightsOut && e.onset && e.wake && e.outOfBed)){ toast("Fill in the four main times"); return; }
    /* inconsistent times are usually an AM/PM slip — one bad night can
       drag every average in the report, so make the parent look twice */
    const chk = computeNight(e);
    if (chk.valid && chk.warnings.length &&
        !confirm("Check the times — "+chk.warnings.join(" ")+" Save anyway?")) return;
    /* guard against silently replacing an already-recorded night */
    const clobbers = cur().entries[e.date] && (!existing || existing.date !== e.date);
    if (clobbers && !confirm("The night of "+fmtDate(e.date)+" is already recorded. Replace it with this entry?")) return;
    e.awakenings = e.awakenings.filter(a=>a.time && a.dur!=="");
    e.naps = e.naps.filter(n=>n.asleep && n.woke && Number(napDur(n)) > 0);
    if (existing && existing.date !== e.date){ delete cur().entries[existing.date]; syncMarkDirty(existing.date); }
    if (!teenBand && !(existing && existing.intoBed)) delete e.intoBed;
    if (napAsk) e.napAsked = true; else delete e.napAsked;
    if (e.naps.length) delete e.noNap;
    /* silent logging time: set once on the first save, never changed by an
       edit (an edit is stamped separately) — the report uses it to say how
       many nights were logged the next day */
    const nowIso = new Date().toISOString();
    if (existing) e.editedAt = nowIso; else e.loggedAt = nowIso;
    cur().entries[e.date] = e;
    syncMarkDirty(e.date);
    saveState(); syncFlush(); editing=null; renderDiary(); $("#hdrSub").textContent=headerSub();
    toast("Night saved");
  }},"Save night"));
  card.append(btns);
  refresh();
  return card;
}
/* Five line-drawn faces, frown -> smile; stroke follows the text color. */
function faceSVG(level){
  const NS = "http://www.w3.org/2000/svg";
  const S = (tag, attrs)=>{ const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const svg = S("svg",{viewBox:"0 0 36 36",fill:"none",stroke:"currentColor","stroke-width":"2","stroke-linecap":"round","aria-hidden":"true"});
  const k = [-6,-3,0,3,6.5][level-1];
  svg.append(S("circle",{cx:18,cy:18,r:15}),
    S("circle",{cx:12.5,cy:14.5,r:1.6,fill:"currentColor",stroke:"none"}),
    S("circle",{cx:23.5,cy:14.5,r:1.6,fill:"currentColor",stroke:"none"}),
    S("path",{d:"M11 "+(23.5-k/2)+" Q18 "+(23.5+k)+" 25 "+(23.5-k/2)}));
  return svg;
}
/* Entry-form wording for plan checklist items (ROADMAP 1.6). Plans are
   written as instructions ("Screens off 60 min before bed"); the diary is
   filled in the next morning, so known items are shown in the past tense.
   Matching is on the exact label text from plan.html's library, so a
   clinician's custom or edited item is never reworded beyond
   "tonight" -> "last night". Reports keep the clinician's original wording. */
const CHECKLIST_PAST = {
  "Screens off 60 min before bed": "Screens were off 60 min before bed",
  "Out of bed if awake > 20 min": "Got out of bed if awake more than 20 min",
  "No caffeine after 2 PM": "No caffeine after 2 PM",
  "Same wake time all 7 days": "Woke up at the planned wake time",
  "Bedroom dark, cool, and quiet": "Bedroom was dark, cool, and quiet",
  "Brief check-ins at set intervals": "Did brief check-ins at set intervals",
  "Same calm 3-step routine every night (bath → books → bed)": "Did the same calm 3-step routine (bath → books → bed)",
  "Check-ins tonight: 3 → 5 → 10 min; brief and boring (under 1 min, low voice, no pickup)":
    "Check-ins last night: 3 → 5 → 10 min; brief and boring (under 1 min, low voice, no pickup)",
  "Tonight's spot: chair beside the bed — calm presence, minimal talk":
    "Last night's spot: chair beside the bed — calm presence, minimal talk",
  "Move the chair farther every 3 nights (middle of room → doorway → out)":
    "Chair stayed in the same spot or moved farther away",
  "Melatonin as prescribed — at the exact time on your prescription":
    "Took melatonin as prescribed — at the exact time on your prescription",
  "Sleep ONLY in the scheduled window — no naps, no dozing outside it":
    "Slept ONLY in the scheduled window — no naps, no dozing outside it",
  "Keep the schedule all 7 days during the shift — no exceptions":
    "Kept to the schedule (all 7 days during the shift — no exceptions)"
};
function checklistPast(label){
  if (CHECKLIST_PAST[label]) return CHECKLIST_PAST[label];
  return String(label).replace(/\bTonight's\b/g,"Last night's").replace(/\btonight's\b/g,"last night's")
                      .replace(/\bTonight\b/g,"Last night").replace(/\btonight\b/g,"last night");
}
/* ---------- chart (Mindell-style shaded log, noon -> noon) ----------
   Shared by the Chart tab and the print report. Colors come from CSS
   classes so they follow the light/dark theme (and print palette). */
function buildChartSVG(entries, opts){
  /* W must fit inside the content column (main max-width minus card
     padding) so the full noon-to-noon axis is visible without horizontal
     scrolling on desktop; phones still scroll the wrap.
     opts.preview: the entry form's one-row preview — a narrower drawing that
     scales to the phone's width instead of scrolling, with no date column
     and a label every 4 hours. */
  const pv = !!(opts && opts.preview);
  const LEFT = pv ? 14 : 58, RIGHT = pv ? 14 : 22, TOP = 26, ROWH = 26, GAP = 6;
  const W = pv ? 360 : 618, plotW = W - LEFT - RIGHT;
  /* nap pieces by the row they are drawn on; a morning nap whose previous
     day has no entry gets a row of its own (naps only), so it is never lost */
  const napsByRow = {};
  entries.forEach(e=> (e.naps||[]).flatMap(napPieces).forEach(x=>{
    if (pv && x.prev) return;                       // the preview is one night
    const d = x.prev ? addDays(e.date, -1) : e.date;
    (napsByRow[d] = napsByRow[d] || []).push(x);
  }));
  const have = new Set(entries.map(e=> e.date));
  const rowsToDraw = entries.concat(Object.keys(napsByRow).filter(d=> !have.has(d)).map(d=>({ date:d, napOnly:true })))
                            .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const H = TOP + rowsToDraw.length*(ROWH+GAP) + 14;
  const x = m => LEFT + (m/1440)*plotW;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  if (!pv){ svg.setAttribute("width", W); svg.setAttribute("height", H); }
  svg.setAttribute("class","sleepchart");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Sleep chart: one row per day from noon to noon; dark bars are night sleep, light bars are naps. The same data appears as a table in the Summary tab.");
  if (!pv) svg.style.maxWidth = "none";
  else svg.setAttribute("aria-label","Preview of this night from noon to noon: dark bars are night sleep, light bars are naps.");
  function S(tag, attrs, text){
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text!=null) n.textContent = text;
    return n;
  }
  const labels = ["Noon","2p","4p","6p","8p","10p","Mid","2a","4a","6a","8a","10a","Noon"];
  for (let i=0;i<=12;i++){
    const gx = x(i*120);
    svg.append(S("line",{class:"c-grid",x1:gx,y1:TOP-6,x2:gx,y2:H-10}));
    if (!pv || i%2===0) svg.append(S("text",{class:"c-glabel",x:gx,y:TOP-12,"text-anchor":"middle","font-size":10.5},labels[i]));
  }
  /* plan target ticks are appended after all rows so they stay visible on
     top of the sleep bars */
  const plan = cur().plan, tickEls = [];
  rowsToDraw.forEach((e,ri)=>{
    const y = TOP + ri*(ROWH+GAP);
    const c = e.napOnly ? { valid:false } : computeNight(e);
    if (!pv) svg.append(S("text",{class:"c-dlabel",x:LEFT-8,y:y+ROWH/2+4,"text-anchor":"end","font-size":11}, fmtDateShort(e.date)));
    svg.append(S("rect",{class:"c-rowbg",x:LEFT,y:y,width:plotW,height:ROWH}));
    if (plan && e.date){
      const t = planTargets(plan, e.date);
      if (t) [t.bed, t.wake].forEach(m=>{
        if (m==null) return;
        const tx = x(((m-720)%1440+1440)%1440);
        tickEls.push(S("line",{class:"c-target",x1:tx,y1:y+1,x2:tx,y2:y+ROWH-1}));
      });
    }
    (napsByRow[e.date]||[]).forEach(p=>{
      svg.append(S("rect",{class:"c-nap",x:x(p.a),y:y+3,width:x(p.b)-x(p.a),height:ROWH-6,rx:2}));
    });
    if (!c.valid) return;
    let segs = [[c.on, c.wk]];
    (e.awakenings||[]).forEach(a=>{
      if (!(a.time && a.dur)) return;
      const t = mfn(a.time), t2 = t + Number(a.dur);
      segs = segs.flatMap(([s0,s1])=>{
        if (t2<=s0 || t>=s1) return [[s0,s1]];
        const out=[]; if (t>s0) out.push([s0,t]); if (t2<s1) out.push([t2,s1]); return out;
      });
    });
    segs.forEach(([s0,s1])=>{
      if (s1>s0) svg.append(S("rect",{class:"c-night",x:x(s0),y:y+3,width:x(s1)-x(s0),height:ROWH-6,rx:2}));
    });
    // arrows: down = into bed (lights out, nap in-bed), up = out of bed
    function arrow(m, up){
      const ax = x(m), y0 = up ? y+ROWH-2 : y+2, y1 = up ? y+6 : y+ROWH-6;
      const g = S("g",{class:"c-arrow"});
      g.append(S("line",{x1:ax,y1:y0,x2:ax,y2:y1}));
      const tip = up ? y+6 : y+ROWH-6, d = up ? 4 : -4;
      g.append(S("line",{x1:ax-3,y1:tip+d,x2:ax,y2:tip}));
      g.append(S("line",{x1:ax+3,y1:tip+d,x2:ax,y2:tip}));
      return g;
    }
    svg.append(arrow(c.lo,false), arrow(c.ob,true));
    /* teen diaries: in bed before lights out, as a bar along the row's base */
    const bm = bedMetrics(e, c);
    if (bm && !bm.late && bm.ib < c.lo)
      svg.append(S("line",{class:"c-inbed",x1:x(bm.ib),y1:y+ROWH-2.5,x2:x(c.lo),y2:y+ROWH-2.5}));
    (e.naps||[]).forEach(n=>{
      if (n.inBed) svg.append(arrow(mfn(n.inBed),false));
      if (n.out) svg.append(arrow(mfn(n.out),true));
    });
  });
  tickEls.forEach(t=> svg.append(t));
  return svg;
}

/* ---------- sleep-timing graph (ROADMAP 1.7) ----------
   Diaries are most accurate for sleep TIMING (Dietch & Taylor 2021), so the
   report shows it night by night: lights out and sleep onset in one panel,
   final wake in another, each on its own clock scale so a 15-minute drift
   is visible, with the plan's nightly targets as dashed marks. Nights with
   no entry leave a gap in the line. */
function buildTimingSVG(s){
  const NS = "http://www.w3.org/2000/svg";
  function S(tag, attrs, text){
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text!=null) n.textContent = text;
    return n;
  }
  const W = 618, LEFT = 58, RIGHT = 22, PH = 104, PGAP = 34, TOP = 22, BOT = 26;
  const plotW = W - LEFT - RIGHT, H = TOP + PH*2 + PGAP + BOT;
  const nDays = daysFrom(s.first, s.last) + 1;
  const step = nDays > 1 ? plotW/(nDays-1) : 0;
  const xOf = i => nDays > 1 ? LEFT + i*step : LEFT + plotW/2;
  const svg = S("svg",{viewBox:`0 0 ${W} ${H}`,class:"timing",role:"img",
    "aria-label":"Sleep timing by night: lights out and sleep onset in the top panel, wake time in the bottom panel. The same times are in the night-by-night table."});
  const plan = cur().plan;
  const toMfn = m => ((m-720)%1440+1440)%1440;
  const days = [];
  for (let i=0;i<nDays;i++){
    const date = addDays(s.first, i);
    const t = plan ? planTargets(plan, date) : null;
    days.push({ date, bed: t && t.bed!=null ? toMfn(t.bed) : null, wake: t && t.wake!=null ? toMfn(t.wake) : null });
  }
  const pts = s.rows.map(r=>({ i: daysFrom(s.first, r.e.date), c: r.c }));
  const hourLabel = m => { const t = clock(m); return t.replace(":00",""); };
  function panel(top, title, series, targetKey){
    const vals = [];
    series.forEach(sr=> pts.forEach(p=> vals.push(p.c[sr.key])));
    days.forEach(d=>{ if (d[targetKey]!=null) vals.push(d[targetKey]); });
    let lo = Math.floor((Math.min(...vals)-20)/60)*60, hi = Math.ceil((Math.max(...vals)+20)/60)*60;
    if (hi - lo < 120){ const mid = (lo+hi)/2; lo = mid-60; hi = mid+60; }
    const yOf = v => top + ((v-lo)/(hi-lo))*PH;
    const gStep = (hi-lo) > 480 ? 120 : 60;
    svg.append(S("text",{class:"t-title",x:LEFT,y:top-8,"font-size":11}, title));
    for (let g=lo; g<=hi; g+=gStep){
      svg.append(S("line",{class:"t-grid",x1:LEFT,y1:yOf(g),x2:W-RIGHT,y2:yOf(g)}));
      svg.append(S("text",{class:"t-label",x:LEFT-8,y:yOf(g)+3.5,"text-anchor":"end","font-size":10.5}, hourLabel(g)));
    }
    const half = nDays > 1 ? Math.min(step*0.42, 14) : 14;
    days.forEach((d,i)=>{
      if (d[targetKey]==null) return;
      svg.append(S("line",{class:"t-target",x1:xOf(i)-half,y1:yOf(d[targetKey]),x2:xOf(i)+half,y2:yOf(d[targetKey])}));
    });
    series.forEach(sr=>{
      let dpath = "", prevI = null;
      pts.forEach(p=>{
        dpath += (prevI!=null && p.i === prevI+1 ? "L" : "M") + xOf(p.i).toFixed(1)+" "+yOf(p.c[sr.key]).toFixed(1);
        prevI = p.i;
      });
      svg.append(S("path",{class:"t-line"+(sr.cls? " "+sr.cls : ""),d:dpath}));
      pts.forEach(p=> svg.append(S("circle",{class:"t-dot"+(sr.cls? " "+sr.cls : ""),cx:xOf(p.i),cy:yOf(p.c[sr.key]),r:nDays>45?2:3})));
    });
  }
  panel(TOP, "Evening — lights out and fell asleep", [{key:"lo",cls:"lo"},{key:"on"}], "bed");
  panel(TOP+PH+PGAP, "Morning — woke for the day", [{key:"wk"}], "wake");
  const every = Math.max(1, Math.ceil(nDays/9));
  for (let i=0;i<nDays;i+=every)
    svg.append(S("text",{class:"t-label",x:xOf(i),y:H-8,"text-anchor":"middle","font-size":10.5}, fmtDateShort(days[i].date)));
  return svg;
}
function timingLegend(){
  return el("div",{class:"legend"},
    el("span",null, el("span",{class:"dot lo"}),"Lights out"),
    el("span",null, el("span",{class:"dot"}),"Fell asleep / woke"),
    cur().plan ? el("span",null, el("span",{class:"sw target"}),"Plan target") : null);
}
/* Sleep efficiency by diary week (week 1 starts on the first recorded
   night). A diary overestimates SE and single nights swing widely, so the
   report judges the weekly mean (Dietch & Taylor 2021). */
const SE_CAVEAT = "Sleep efficiency from a diary usually reads a little high, and single nights vary a lot. Look at the weekly average.";
const SE_CAVEAT_CITE = "Diaries overestimate sleep efficiency (about 7 points against EEG in adults; Dietch & Taylor, J Clin Sleep Med 2021;17:1389).";
function weeklySE(s){
  const weeks = [];
  s.rows.forEach(r=>{
    const w = Math.floor(daysFrom(s.first, r.e.date)/7);
    (weeks[w] = weeks[w] || []).push(r);
  });
  return weeks.map((rows,w)=>{
    if (!rows) return null;
    const bed = rows.filter(r=> r.b && !isNaN(r.b.seBed)).map(r=> r.b.seBed);
    return { w: w+1, from: addDays(s.first, w*7), to: rows[rows.length-1].e.date, n: rows.length,
             se: mean(rows.map(r=>r.c.se).filter(x=>!isNaN(x))), seBed: mean(bed),
             tst: mean(rows.map(r=>r.c.tst)) };
  }).filter(Boolean);
}
const pct = x => isNaN(x) ? "—" : x.toFixed(0)+"%";
function weeklySETable(s){
  const tbl = el("table",{class:"pernight"});
  tbl.append(el("tr",null, ["Week","Nights", s.teen ? "SE from lights out" : "Sleep efficiency",
    s.teen ? "SE from getting into bed" : null, "Night sleep"].filter(Boolean).map(h=>el("th",null,h))));
  weeklySE(s).forEach(k=> tbl.append(el("tr",null,
    el("td",null,"Week "+k.w+" ("+fmtDateShort(k.from)+"–"+fmtDateShort(k.to)+")"),
    el("td",null,String(k.n)), el("td",null,pct(k.se)),
    s.teen ? el("td",null,pct(k.seBed)) : null,
    el("td",null,dur(k.tst)))));
  return tbl;
}
function qualityLine(s){
  return QUALITY_LABELS.map((l,i)=> l+" "+s.quality.counts[i]).join(" · ")
       + " ("+s.quality.n+" of "+s.n+" nights rated)";
}

/* ---------- summary view ---------- */
function pmStat(v, label, sdv, fmt){
  const f = fmt || dur;
  return el("div",{class:"stat"},
    el("div",{class:"v"}, isNaN(v)? "—" : f(v),
      (sdv!=null && !isNaN(sdv)) ? el("span",{class:"pm"}," ± "+Math.round(sdv)+" min") : null),
    el("div",{class:"k"},label));
}

    el("div",{class:"stat"}, el("div",{class:"v"}, sri==null? "—" : sri.toFixed(0)), el("div",{class:"k"},"Sleep Regularity Index (usually 0–100; needs consecutive days)"))

  }
  card.append(el("div",{class:"hint",style:"margin-top:8px"},
    "Bedtime/onset/wake variability is shown as ± SD. " + (s.teen
      ? "SE (sleep efficiency) from lights out = night sleep ÷ time from lights out to out of bed. SE from getting into bed = night sleep ÷ time from getting into bed to out of bed."
      : "Sleep efficiency = night sleep ÷ time in bed.")));
  if (s.quality.n)
    card.append(el("div",{class:"hint",style:"margin-top:4px"},
      el("b",null,(reporter()==="teen" ? "Sleep quality (self-rated): " : "Sleep quality (parent-rated): ")), qualityLine(s)));
  if (s.naps.asked)
    card.append(el("div",{class:"hint",style:"margin-top:4px"}, el("b",null,"Naps: "), napLine(s)));
  if (s.logging)
    card.append(el("div",{class:"hint",style:"margin-top:4px"}, el("b",null,"Logging: "), loggingLine(s.logging)));
  v.append(card);

  /* sleep timing night by night + weekly efficiency */
  const tc = el("div",{class:"card"});

  /* clinician plan adherence */
  const pa = planAdherence();
  if (pa){

    if (!isNaN(pa.bedDev))
      pc.append(el("div",null, el("b",null,"Lights out vs. target: "),

    if (pa.items.length){
      const tbl = el("table",{class:"pernight"});
      tbl.append(el("tr",null, el("th",null,"Checklist item"), el("th",null,"Done"), el("th",null,"%")));
      pa.items.forEach(it=> tbl.append(el("tr",null,

/* ---------- share view ---------- */

    const pad=(t,n)=>String(t).padEnd(n);
    L.push("  "+pad(fmtDateShort(r.e.date),7)+pad(clock(c.lo),10)+pad(clock(c.on),8)+pad(clock(c.wk),7)
      +pad(clock(c.ob),8)+pad(dur(c.tst),7)+pad(isNaN(c.se)?"—":c.se.toFixed(0)+"%",5)
      +pad(c.waso? c.waso+"m":"0",5)+pad(c.nAw,6)+pad(c.nHelp,5)
      +(c.nNaps? c.nNaps+" ("+dur(c.napSleep)+")": (napStatus(r.e)==="unknown" ? "not recorded" : "0"))
      /* optional trailing details, only when recorded */
      +(r.b ? "  | into bed "+clock(r.b.ib)+", SE from getting into bed "+pct(r.b.seBed) : "")
      +(r.e.quality ? "  | quality: "+QUALITY_LABELS[r.e.quality-1] : ""));
  });
  const noted = s.rows.filter(r=>r.e.notes);
  if (noted.length){
    L.push(""); L.push("NOTES");
    noted.forEach(r=>L.push("  "+fmtDateShort(r.e.date)+": "+r.e.notes));
  }
  L.push("");
  L.push("Generated by Pediatric Sleep Diary (data entered by "+(reporter()==="teen" ? "the teen" : "parent/caregiver")+").");
  return L.join("\n");
}
/* Export columns added in v2.5.0, shared by both CSVs. The "from bed" trio
   is blank outside the teen age bands; logged_at is the phone's local time. */
function phase1Cols(e, c){
  const b = bedMetrics(e, c), li = logInfo(e);
  return [ b ? e.intoBed : "",
           b && !isNaN(b.tibBed) ? Math.round(b.tibBed) : "",
           b && !isNaN(b.seBed) ? b.seBed.toFixed(1) : "",
           (e.quality >= 1 && e.quality <= 5) ? e.quality : "",
           li ? li.local : "", li ? li.lag : "", reporter(),
           ({ nap:"nap", none:"no_nap", unknown:"not_recorded", notasked:"not_asked" })[napStatus(e)] ];
}
function buildCSV(){
  const rows = sortedEntries();
  const head = ["child_initials","date","lights_out","sleep_onset","final_wake","out_of_bed",
    "sol_min","tst_min","tib_min","se_pct","waso_min","n_awakenings","n_parent_interventions",
    "awakenings_detail","n_naps","nap_sleep_min","naps_detail",
    "got_into_bed","tib_from_bed_min","se_from_bed_pct","sleep_quality","logged_at","logged_lag_days","reported_by","nap_status","notes"];
  const esc = x => { x = (x==null?"":String(x)); return /[",\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x; };
  const out = [head.join(",")];
  const who = cur().settings.initials || "";
  rows.forEach(e=>{
    const c = computeNight(e);
    const awd = (e.awakenings||[]).map(a=>a.time+" ("+a.dur+"m, "+(HELP_LABELS[a.help]||a.help)+")").join("; ");
    const npd = (e.naps||[]).map(napDetail).join("; ");
    out.push([who, e.date, e.lightsOut, e.onset, e.wake, e.outOfBed,
      c.valid?Math.round(c.sol):"", c.valid?Math.round(c.tst):"", c.valid?Math.round(c.tib):"",
      c.valid&&!isNaN(c.se)?c.se.toFixed(1):"", c.valid?Math.round(c.waso):"",
      c.valid?c.nAw:"", c.valid?c.nHelp:"",
      awd, (e.naps||[]).length, c.valid?Math.round(c.napSleep):"", npd,
      ...phase1Cols(e, c), e.notes||""
    ].map(esc).join(","));
  });
  return out.join("\n");
}
/* REDCap-ready research export (Phase A — see redcap/README.md).
   Differences from the clinic CSV: record_id is the study's participant
   code (never initials), repeat instances are days-since-first-night so
   re-imports update rather than duplicate, and free-text notes are
   deliberately omitted. Column names match redcap/sleep_diary_data_dictionary.csv. */
function buildResearchCSV(){
  const code = ((cur().research && cur().research.participantCode) || "").trim();
  const rows = sortedEntries();
  const head = ["record_id","redcap_repeat_instrument","redcap_repeat_instance","night_date",
    "lights_out","sleep_onset","final_wake","out_of_bed","sol_min","tst_min","tib_min","se_pct",
    "waso_min","n_awakenings","n_parent_interventions","awakenings_detail","n_naps","nap_sleep_min","naps_detail",
    "got_into_bed","tib_from_bed_min","se_from_bed_pct","sleep_quality","logged_at","logged_lag_days","reported_by","nap_status"];
  const esc = x => { x = (x==null?"":String(x)); return /[",\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x; };
  const out = [head.join(",")];
  if (!rows.length) return out.join("\n");
  const first = rows[0].date;
  rows.forEach(e=>{
    const c = computeNight(e);
    const awd = (e.awakenings||[]).map(a=>a.time+" ("+a.dur+"m, "+(HELP_LABELS[a.help]||a.help)+")").join("; ");
    const npd = (e.naps||[]).map(napDetail).join("; ");
    out.push([code, "sleep_night", daysFrom(first, e.date)+1, e.date,
      e.lightsOut, e.onset, e.wake, e.outOfBed,
      c.valid?Math.round(c.sol):"", c.valid?Math.round(c.tst):"", c.valid?Math.round(c.tib):"",
      c.valid&&!isNaN(c.se)?c.se.toFixed(1):"", c.valid?Math.round(c.waso):"",
      c.valid?c.nAw:"", c.valid?c.nHelp:"", awd,
      (e.naps||[]).length, c.valid?Math.round(c.napSleep):"", npd,
      ...phase1Cols(e, c)
    ].map(esc).join(","));
  });
  return out.join("\n");
}

/* ============================================================
   Backup & restore
   ============================================================ */

/* ---- Google Drive backup (optional) ----
   To enable: create a Google Cloud project, configure an OAuth
   consent screen, create a Web OAuth client ID, add your hosting
   origin to "Authorized JavaScript origins", and paste the client
   ID below. Scope is drive.file only: the app can touch ONLY the
   one backup file it creates, nothing else in the parent's Drive. */
const GOOGLE_CLIENT_ID = "";   // e.g. "1234567890-abc.apps.googleusercontent.com"
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FILENAME = "pediatric-sleep-diary-backup.json";

function backupPayload(){
  return JSON.stringify({
    format:"peds-sleep-diary-backup", version:2,
    exported:new Date().toISOString(),
    activeChild: state.activeChild,
    children: state.children
  }, null, 1);
}
function applyBackup(obj){
  if (!obj || obj.format!=="peds-sleep-diary-backup")
    throw new Error("Not a sleep diary backup file.");
  let added=0, updated=0;
  const mergeEntries = (target, entries)=>{
    Object.values(entries||{}).forEach(e=>{
      if (!e || !e.date) return;
      if (target.entries[e.date]) updated++; else added++;
      target.entries[e.date]=e;
    });
  };
  if (obj.version>=2 && obj.children && typeof obj.children==="object"){
    Object.keys(obj.children).forEach(id=>{
      const src = obj.children[id];
      if (!src || typeof src!=="object") return;
      if (!state.children[id]){
        state.children[id] = blankChild();
        state.children[id].settings = Object.assign(blankChild().settings, src.settings||{});
      } else if (src.settings){
        if (src.settings.initials && !state.children[id].settings.initials)
          state.children[id].settings.initials = src.settings.initials;
        if (src.settings.ageBand && !state.children[id].settings.ageBand)
          state.children[id].settings.ageBand = src.settings.ageBand;
        if (src.settings.reporter && !state.children[id].settings.reporter)
          state.children[id].settings.reporter = src.settings.reporter;
      }
      /* the clinician plan and study code travel with the backup too —
         a new phone should not silently lose them. Never restore `sync`:
         sharing consent belongs to the device where it was given. */
      const dst = state.children[id];
      if (src.plan && !dst.plan) dst.plan = src.plan;
      if (Array.isArray(src.planHistory) && src.planHistory.length && !(dst.planHistory||[]).length)
        dst.planHistory = src.planHistory;
      if (src.research && src.research.participantCode && !(dst.research && dst.research.participantCode))
        dst.research = { participantCode: src.research.participantCode };
      mergeEntries(dst, src.entries);
    });
  } else if (typeof obj.entries==="object"){
    /* v1 backup: merge into the active child */
    mergeEntries(cur(), obj.entries);
    if (obj.settings && obj.settings.initials && !cur().settings.initials)
      cur().settings.initials = obj.settings.initials;
  } else {
    throw new Error("Not a sleep diary backup file.");
  }
  saveState();
  return {added, updated};
}

let gisLoaded = null;
function loadGIS(){
  if (gisLoaded) return gisLoaded;
  gisLoaded = new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = ()=>res(); s.onerror = ()=>rej(new Error("Could not load Google sign-in. Check your connection."));
    document.head.append(s);
  });
  return gisLoaded;
}
function getDriveToken(){
  return new Promise(async (res,rej)=>{
    if (IS_NATIVE){
      rej(new Error("Google Drive backup isn't available in the app yet — use “Share backup file” instead."));
      return;
    }
    try { await loadGIS(); } catch(e){ rej(e); return; }
    if (!(window.google && google.accounts && google.accounts.oauth2)){
      rej(new Error("Google sign-in unavailable in this environment.")); return;
    }
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: t => t && t.access_token ? res(t.access_token) : rej(new Error("Sign-in was cancelled."))
    });
    tc.requestAccessToken();
  });
}
async function driveFindFile(token){
  if (state.drive.fileId){
    const r = await fetch("https://www.googleapis.com/drive/v3/files/"+state.drive.fileId+"?fields=id,trashed",
      {headers:{Authorization:"Bearer "+token}});
    if (r.ok){ const f = await r.json(); if (!f.trashed) return f.id; }
    state.drive.fileId = null;
  }
  const q = encodeURIComponent("name='"+DRIVE_FILENAME+"' and trashed=false");
  const r = await fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id)",
    {headers:{Authorization:"Bearer "+token}});
  if (r.ok){ const d = await r.json(); if (d.files && d.files.length) return d.files[0].id; }
  return null;
}
async function driveBackup(){
  const token = await getDriveToken();
  let id = await driveFindFile(token);
  const body = backupPayload();
  let r;
  if (id){
    r = await fetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",
      {method:"PATCH", headers:{Authorization:"Bearer "+token, "Content-Type":"application/json"}, body});
  } else {
    const boundary = "pdsleep" + Date.now();
    const multi =
      "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+
      JSON.stringify({name:DRIVE_FILENAME, mimeType:"application/json"})+
      "\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+boundary+"--";
    r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      {method:"POST", headers:{Authorization:"Bearer "+token, "Content-Type":"multipart/related; boundary="+boundary}, body:multi});
  }
  if (!r.ok) throw new Error("Drive upload failed ("+r.status+").");
  const f = await r.json();
  if (f.id){ state.drive.fileId = f.id; }
  state.drive.lastBackupAt = new Date().toISOString();
  saveState();
}
async function driveRestore(){
  const token = await getDriveToken();
  const id = await driveFindFile(token);
  if (!id) throw new Error("No backup found in this Google account.");
  const r = await fetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media",
    {headers:{Authorization:"Bearer "+token}});
  if (!r.ok) throw new Error("Could not download the backup ("+r.status+").");
  return applyBackup(await r.json());
}

/* ============================================================
   Consultant sync — Phase 1 skeleton (docs/specs/consultant-sync.md)
   ============================================================
   Entirely inert until SYNC_ENDPOINT is set (same pattern as
   GOOGLE_CLIENT_ID). A consultant's invite arrives as #connect=<code>;
   the family consents on the Diary tab; after that, saves queue the
   night's date in child.sync.pending and syncFlush() pushes idempotent
   upserts keyed on (code, date). Pseudonymous by design: the payload
   carries sleep times, adherence, and notes — never a name. */
const SYNC_ENDPOINT = "";   // e.g. "https://sync.example.com/v1" — empty = feature off
let pendingConnect = null;  // {code, consultant:{name, practice?}} awaiting consent

async function fetchInvite(code){
  try{
    const r = await fetch(SYNC_ENDPOINT+"/invite/"+encodeURIComponent(code));
    if (!r.ok) throw new Error();
    const inv = await r.json();
    if (!(inv && inv.consultant && inv.consultant.name)) throw new Error();
    pendingConnect = { code, consultant: inv.consultant };
    if (!editing) render();
  }catch(err){
    toast("That sharing link could not be read — ask your consultant for a new one.");
  }
}
function syncMarkDirty(date){
  const s = cur().sync;
  if (!s) return;
  if (!Array.isArray(s.pending)) s.pending = [];
  if (!s.pending.includes(date)) s.pending.push(date);
}
let syncInFlight = false;
async function syncFlush(){
  if (!SYNC_ENDPOINT || syncInFlight || navigator.onLine === false) return;
  const jobs = Object.values(state.children).filter(c=> c.sync && (c.sync.pending||[]).length);
  if (!jobs.length) return;
  syncInFlight = true;
  try{
    for (const c of jobs){
      const dates = c.sync.pending.slice();
      /* a queued date with no entry means the night was deleted here */
      const entries = dates.map(d=> c.entries[d] || { date:d, deleted:true });
      let r;
      try{
        r = await fetch(SYNC_ENDPOINT+"/sync", { method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ v:1, code:c.sync.code, entries }) });
      }catch(err){ continue; }             /* offline/unreachable — retry later */
      if (r.status === 403 || r.status === 410){
        c.sync = null; saveState();        /* consultant revoked the code */
        toast("Sharing was ended by your consultant.");
        continue;
      }
      if (!r.ok) continue;                 /* server hiccup — keep queued */
      c.sync.pending = c.sync.pending.filter(d=> !dates.includes(d));
      c.sync.lastPushedAt = new Date().toISOString();
      saveState();
    }
  } finally { syncInFlight = false; }
}
window.addEventListener("online", ()=>{ syncFlush(); });

function connectOfferCard(){
  const p = pendingConnect;
  const c = el("div",{class:"card tint"});
  c.append(el("h2",null,"Sharing invitation", el("span",{class:"big"},
    p.consultant.name + (p.consultant.practice? " · "+p.consultant.practice : ""))));
  const who = cur().settings.initials;
  c.append(el("div",null,
    "Share "+(who? who+"'s" : "this")+" diary with your sleep consultant? "+
    "They will see sleep times, checklist adherence, and your notes as you log them — no name is ever sent."));
  c.append(el("div",{class:"hint"},
    "Avoid identifying details in notes. You can stop sharing anytime in the Share tab; your diary always stays on this phone either way."));
  c.append(el("div",{class:"btn-row"},
    el("button",{class:"btn-secondary",onclick:()=>{ pendingConnect=null; renderDiary(); }},"Not now"),
    el("button",{class:"btn-primary",onclick:()=>{
      cur().sync = { code:p.code, consultant:p.consultant, since:isoToday(),
                     pending:Object.keys(cur().entries), lastPushedAt:null };
      pendingConnect = null;
      saveState(); syncFlush(); renderDiary();
      toast("Sharing with "+p.consultant.name);
    }},"Share this diary")
  ));
  return c;
}

/* ---------- init ---------- */
(async function(){
  /* Ask the browser to keep our storage through cleanup passes. */
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  /* Offline support + installability (no-op on file://, in the native
     shell — which is already offline-capable — or unsupported). */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !IS_NATIVE && !PRINT_MODE){
    /* When an updated service worker takes control, reload once so the new
       version appears on THIS open instead of the next one. Skip if a form
       is open (reloading would discard the parent's typing) and on first
       install (no controller yet — nothing stale to replace). */
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if (hadController && !editing) location.reload();
      hadController = true;
    });
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  await loadState();
  /* Write through immediately so IndexedDB (the durable store) holds the
     current state even if the user never edits this session. */
  KV.set(STORE_KEY, JSON.stringify(state));
  /* A clinician plan arriving in the URL fragment (#plan=…) — decode it,
     then scrub the fragment so the capsule never lingers in the address
     bar or history. The family accepts or declines on the Diary tab. */
  const planMatch = location.hash.match(/[#&]plan=([A-Za-z0-9\-_]+)/);
  if (planMatch){
    pendingPlan = decodePlanParam(planMatch[1]);
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(err){}
    if (!pendingPlan) toast("That plan link could not be read — ask for a new one.");
  }
  /* A consultant invite (#connect=…) — scrub the fragment, then fetch the
     invite preview so the family sees WHO is asking before consenting. */
  const connMatch = location.hash.match(/[#&]connect=([A-Za-z0-9\-_]+)/);
  if (connMatch){
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(err){}
    if (SYNC_ENDPOINT) fetchInvite(connMatch[1]);
    else toast("Sharing with a consultant isn't enabled in this copy of the app.");
  }
  /* Re-assert the daily reminder in the native shell (survives OS cleanups). */
  if (IS_NATIVE && state.meta.reminder.enabled) applyReminder().catch(()=>{});
  render();
  syncFlush();   /* retry any queued consultant pushes from a previous session */
  /* ?print — pre-build the physician report so the browser's own
     Print / Save-as-PDF captures it (also used to generate the repo's
     sample-report.pdf). */
  if (PRINT_MODE) buildPrintReport();
})();
</script>
