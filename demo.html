<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep Diary">
<meta name="theme-color" content="#2A7D6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pediatric Sleep Diary — Demo</title>
<style>
/* ============================================================
   Canapari brand tokens — "Fossil" palette (pasted from brand.css)
   ============================================================ */
:root {
  --brand-bg:             #F5F2EE;
  --brand-surface:        #EDE9E4;
  --brand-ink:            #050911;
  --brand-muted:          #6B655C;
  --brand-muted-graphic:  #8A847B;
  --brand-accent:         #2A7D6B;
  --brand-accent-text:    #1F6A59;
  --brand-accent-hover:   #1A5546;
  --brand-on-accent:      #FFFFFF;
  --brand-accent-tint:    #E7F0ED;
  --brand-accent-border:  #C9E0D8;
  --brand-warning:        #B4472F;
  --brand-warning-tint:   #FBF1ED;
  --brand-warning-border: #EFD8D0;
  --brand-border:         #DED8CF;
  --brand-font-heading: 'Plus Jakarta Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
  --brand-font-body:    'Charter', 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, serif;
  --brand-text-base:    18px;
  --brand-line-body:    1.55;
  --brand-line-heading: 1.2;
  --brand-tracking-h1:  -0.02em;
  --brand-radius:    8px;
  --brand-radius-lg: 12px;
  --brand-shadow:    0 4px 20px rgba(5, 9, 17, 0.08);
  --color-bg:         var(--brand-bg);
  --color-surface:    var(--brand-surface);
  --color-text:       var(--brand-ink);
  --color-text-muted: var(--brand-muted);
  --color-accent:     var(--brand-accent);
  --color-link:       var(--brand-accent-text);
  --color-on-accent:  var(--brand-on-accent);
  --color-border:     var(--brand-border);
  --color-warning:    var(--brand-warning);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand-bg:             #1A1A1B;
    --brand-surface:        #141413;
    --brand-ink:            #F5F2EE;
    --brand-muted:          #B5AFA6;
    --brand-muted-graphic:  #B5AFA6;
    --brand-accent:         #4FB89F;
    --brand-accent-text:    #4FB89F;
    --brand-accent-hover:   #69C9B1;
    --brand-on-accent:      #10231F;
    --brand-accent-tint:    #17302A;
    --brand-accent-border:  #24463D;
    --brand-warning:        #E08769;
    --brand-warning-tint:   #2A1A14;
    --brand-warning-border: #4A2A1E;
    --brand-border:         #2E2D2A;
    --brand-shadow:         0 4px 20px rgba(0, 0, 0, 0.40);
  }
}
[data-theme="dark"] {
  --brand-bg:             #1A1A1B;
  --brand-surface:        #141413;
  --brand-ink:            #F5F2EE;
  --brand-muted:          #B5AFA6;
  --brand-muted-graphic:  #B5AFA6;
  --brand-accent:         #4FB89F;
  --brand-accent-text:    #4FB89F;
  --brand-accent-hover:   #69C9B1;
  --brand-on-accent:      #10231F;
  --brand-accent-tint:    #17302A;
  --brand-accent-border:  #24463D;
  --brand-warning:        #E08769;
  --brand-warning-tint:   #2A1A14;
  --brand-warning-border: #4A2A1E;
  --brand-border:         #2E2D2A;
  --brand-shadow:         0 4px 20px rgba(0, 0, 0, 0.40);
}

/* ============================================================
   App styles — reference semantic tokens only
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg);color:var(--color-text);
  font-family:var(--brand-font-body);
  font-size:17px;line-height:var(--brand-line-body);
  padding-bottom:88px;
  -webkit-text-size-adjust:100%;
}
header.app{
  background:var(--color-accent);color:var(--color-on-accent);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
  /* stay under the iOS status bar while content scrolls beneath */
  position:sticky;top:0;z-index:30;
}
header.app h1{margin:0;font-size:19px;font-weight:800;letter-spacing:var(--brand-tracking-h1);font-family:var(--brand-font-heading)}
header.app .sub{font-size:13.5px;opacity:.85;margin-top:2px;font-family:var(--brand-font-heading)}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--brand-radius-lg);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-muted);font-family:var(--brand-font-heading)}
.card h2 .big{display:block;text-transform:none;letter-spacing:var(--brand-tracking-h1);color:var(--color-text);font-size:18px;margin-top:2px;font-weight:700}
.card.tint{background:var(--brand-accent-tint);border-color:var(--brand-accent-border)}
.card.warn{background:var(--brand-warning-tint);border-color:var(--brand-warning-border)}
button{font-family:var(--brand-font-heading);font-size:15.5px;cursor:pointer;border:none;border-radius:var(--brand-radius);padding:11px 14px}
.btn-primary{
  background:linear-gradient(180deg,var(--color-accent),var(--brand-accent-hover));
  color:var(--color-on-accent);font-weight:700;width:100%;
}
.btn-secondary{background:var(--color-bg);border:1px solid var(--color-border);color:var(--color-text);font-weight:600}
.btn-ghost{background:transparent;color:var(--color-link);font-weight:700;padding:8px 10px}
.btn-danger{background:transparent;color:var(--color-warning);font-weight:600}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row>button{flex:1}
label{display:block;font-size:13px;font-weight:700;color:var(--color-text-muted);margin:10px 0 4px;font-family:var(--brand-font-heading)}
input[type=date],input[type=time],input[type=number],input[type=text],select,textarea{
  font:inherit;width:100%;padding:9px 10px;border:2px solid var(--color-border);
  border-radius:var(--brand-radius);background:var(--color-bg);color:var(--color-text);
  /* iOS date/time inputs have an intrinsic width that overflows grid columns
     unless the native appearance is stripped */
  -webkit-appearance:none;appearance:none;min-width:0;box-sizing:border-box;
}
input[type=date],input[type=time]{display:block;text-align:left;-webkit-text-align:left}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--color-accent);
  box-shadow:0 0 0 3px rgba(42,125,107,0.18);
}
textarea{resize:vertical;min-height:54px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>div{min-width:0}
.sub-item{border:1px dashed var(--color-border);border-radius:var(--brand-radius);padding:10px;margin-top:8px;background:var(--color-bg)}
.sub-item .rm{float:right}
.hint{font-size:13.5px;color:var(--color-text-muted);margin-top:4px}
.warnmsg{font-size:14px;color:var(--color-warning);margin-top:6px}
/* entry list */
.entry-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--color-border);cursor:pointer}
.entry-row:last-child{border-bottom:none}
.entry-row .d{font-weight:700;font-family:var(--brand-font-heading);font-size:15px}
.entry-row .meta{font-size:13.5px;color:var(--color-text-muted)}
.entry-row .chev{color:var(--color-text-muted)}
.empty{padding:26px 8px;text-align:center;color:var(--color-text-muted);font-size:15px}
/* missed-night chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{background:var(--color-bg);border:1px solid var(--color-border);color:var(--color-link);font-weight:700;font-size:13.5px;padding:7px 11px;border-radius:999px}
/* stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--brand-radius);padding:10px}
.stat .v{font-size:21px;font-weight:800;line-height:1.15;font-family:var(--brand-font-heading);color:var(--brand-accent-text)}
.stat .v .pm{font-size:12.5px;font-weight:600;color:var(--color-text-muted)}
.stat .k{font-size:12.5px;color:var(--color-text-muted);margin-top:2px;font-family:var(--brand-font-heading)}
table.pernight{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.pernight th,table.pernight td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--color-border);white-space:nowrap}
table.pernight th:first-child,table.pernight td:first-child{text-align:left}
table.pernight th{color:var(--color-text-muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;font-family:var(--brand-font-heading)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* chart */
.chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend{display:flex;gap:16px;font-size:13px;color:var(--color-text-muted);margin-top:8px;flex-wrap:wrap}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend .sw.night{background:var(--color-accent)}
.legend .sw.nap{background:var(--brand-accent-border);border:1px solid var(--color-accent)}
.legend .sw.target{background:transparent;width:4px;border-left:3px dashed var(--color-warning);border-radius:0}
/* SVG chart parts (colors resolve with the theme) */
svg.sleepchart .c-grid{stroke:var(--color-border);stroke-width:1}
svg.sleepchart .c-glabel{fill:var(--color-text-muted);font-family:var(--brand-font-heading)}
svg.sleepchart .c-dlabel{fill:var(--color-text);font-weight:600;font-family:var(--brand-font-heading)}
svg.sleepchart .c-rowbg{fill:var(--color-bg);stroke:var(--color-border)}
svg.sleepchart .c-night{fill:var(--color-accent)}
svg.sleepchart .c-nap{fill:var(--brand-accent-border);stroke:var(--color-accent);stroke-width:.75}
svg.sleepchart .c-arrow{stroke:var(--color-text);stroke-width:1.6;fill:none}
svg.sleepchart .c-target{stroke:var(--color-warning);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
svg.sleepchart .c-inbed{stroke:var(--brand-muted-graphic);stroke-width:3;fill:none;stroke-linecap:round}
.legend .sw.inbed{background:var(--brand-muted-graphic);height:3px;border-radius:2px;vertical-align:4px}
/* live one-row preview of the night (entry form) */
.night-preview{margin-top:10px}
.night-preview svg{display:block;width:100%;height:auto;max-width:520px}
.softnote{font-size:13.5px;color:var(--color-text);background:var(--brand-accent-tint);border:1px solid var(--brand-accent-border);
  border-radius:var(--brand-radius);padding:8px 10px;margin-top:6px}
.softnote b{font-family:var(--brand-font-heading)}
/* sleep-quality faces (CSD Core #8) */
.faces{display:flex;gap:6px;margin-top:4px}
.faces button{flex:1;background:var(--color-bg);border:2px solid var(--color-border);color:var(--color-text-muted);
  padding:6px 0;min-height:48px}
.faces button svg{width:34px;height:34px;display:block;margin:0 auto}
.faces button[aria-checked="true"]{border-color:var(--color-accent);background:var(--brand-accent-tint);color:var(--color-link)}
.face-label{min-height:1.5em;font-family:var(--brand-font-heading);font-weight:700;font-size:14.5px;text-align:center;
  margin-top:4px;color:var(--color-link)}
/* sleep-timing graph (Summary tab + print report) */
svg.timing{display:block;width:100%;height:auto}
svg.timing .t-grid{stroke:var(--color-border);stroke-width:1}
svg.timing .t-label{fill:var(--color-text-muted);font-family:var(--brand-font-heading)}
svg.timing .t-title{fill:var(--color-text);font-weight:700;font-family:var(--brand-font-heading)}
svg.timing .t-line{stroke:var(--color-accent);stroke-width:1.5;fill:none}
svg.timing .t-line.lo{stroke:var(--brand-muted-graphic);stroke-dasharray:1 3;stroke-linecap:round}
svg.timing .t-dot{fill:var(--color-accent)}
svg.timing .t-dot.lo{fill:var(--color-bg);stroke:var(--brand-muted-graphic);stroke-width:1.5}
svg.timing .t-target{stroke:var(--color-warning);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--color-accent)}
.legend .dot.lo{background:var(--color-bg);border:1.5px solid var(--brand-muted-graphic)}
/* tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;background:var(--color-surface);border-top:1px solid var(--color-border);
  display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);
  z-index:20;
}
nav.tabs button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--color-text-muted);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--brand-radius)}
nav.tabs button.active{color:var(--color-link)}
nav.tabs button svg{width:22px;height:22px}
.view{display:none}
.view.active{display:block}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--color-text);color:var(--color-bg);padding:10px 16px;border-radius:999px;font-size:14.5px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;white-space:nowrap;font-family:var(--brand-font-heading);
}
.toast.show{opacity:1}
pre.export{
  background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--brand-radius);padding:10px;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre;overflow-x:auto;max-height:300px;overflow-y:auto;color:var(--color-text);
}
.banner{
  background:var(--brand-warning-tint);border:1px solid var(--brand-warning-border);
  border-radius:var(--brand-radius-lg);padding:12px 14px;margin-bottom:12px;font-size:14.5px;
}
.banner b{font-family:var(--brand-font-heading)}
.banner button{margin-top:8px}
.nsf-flag{border-radius:var(--brand-radius);padding:10px 12px;margin-top:10px;font-size:14.5px}
.nsf-flag.ok{background:var(--brand-accent-tint);border:1px solid var(--brand-accent-border);color:var(--color-text)}
.nsf-flag.may{background:var(--brand-warning-tint);border:1px solid var(--brand-warning-border);color:var(--color-text)}
.nsf-flag b{font-family:var(--brand-font-heading)}
/* clinician plan strip (entry form) and plan cards */
.plan-strip{background:var(--brand-accent-tint);border:1px solid var(--brand-accent-border);
  border-radius:var(--brand-radius);padding:10px 12px;margin-top:10px}
.plan-strip .pf{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--color-link);font-family:var(--brand-font-heading)}
.plan-strip .pt{font-weight:700;font-family:var(--brand-font-heading);font-size:15px;margin-top:2px;color:var(--color-text)}
.plan-strip label.pl{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin:8px 0 0;
  font-weight:400;color:var(--color-text);text-transform:none;letter-spacing:0;cursor:pointer}
.plan-strip label.pl input{width:auto;min-width:16px;margin-top:3px;accent-color:var(--brand-accent);-webkit-appearance:checkbox;appearance:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============================================================
   Print report — only #printReport prints, in light palette
   ============================================================ */
#printReport{display:none}
@media print{
  :root, :root:not([data-theme="light"]), [data-theme="dark"]{
    --brand-bg:#FFFFFF; --brand-surface:#FFFFFF; --brand-ink:#050911;
    --brand-muted:#6B655C; --brand-muted-graphic:#8A847B;
    --brand-accent:#2A7D6B; --brand-accent-text:#1F6A59;
    --brand-accent-hover:#1A5546; --brand-on-accent:#FFFFFF;
    --brand-accent-tint:#E7F0ED; --brand-accent-border:#C9E0D8;
    --brand-warning:#B4472F; --brand-warning-tint:#FBF1ED;
    --brand-warning-border:#EFD8D0; --brand-border:#DED8CF;
  }
  body{background:#fff;padding:0}
  body>header.app, body>main, body>nav.tabs, body>.toast{display:none!important}
  #printReport{display:block;font-size:12px;color:#050911}
  #printReport h1{font-size:18px;margin:0 0 2px;font-family:var(--brand-font-heading)}
  #printReport .prsub{font-size:12px;color:#6B655C;margin-bottom:12px}
  #printReport h2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin:16px 0 6px;font-family:var(--brand-font-heading)}
  #printReport table{width:100%;border-collapse:collapse;font-size:11px}
  #printReport th,#printReport td{padding:4px 6px;border-bottom:1px solid #DED8CF;text-align:right;white-space:nowrap}
  #printReport th:first-child,#printReport td:first-child{text-align:left}
  #printReport th{text-align:right;color:#6B655C;font-size:10px;text-transform:uppercase}
  #printReport svg{width:100%;height:auto}
  #printReport .prfoot{margin-top:14px;font-size:10px;color:#6B655C}
  #printReport .nsf-flag{page-break-inside:avoid}
}
</style>
</head>
<body>
<header class="app">
  <h1>Pediatric Sleep Diary</h1>
  <div class="sub" id="hdrSub">Track your child's sleep, night by night</div>
</header>
<main>
  <div id="view-diary" class="view active" role="tabpanel" aria-label="Diary"></div>
  <div id="view-chart" class="view" role="tabpanel" aria-label="Chart"></div>
  <div id="view-summary" class="view" role="tabpanel" aria-label="Summary"></div>
  <div id="view-share" class="view" role="tabpanel" aria-label="Share"></div>
</main>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button data-tab="diary" class="active" role="tab" aria-selected="true" aria-controls="view-diary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 4v13a3 3 0 0 0 3 3"/><path d="M9 9h6M9 13h6"/></svg>
    Diary</button>
  <button data-tab="chart" role="tab" aria-selected="false" aria-controls="view-chart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="6" y="11" width="14" height="3" rx="1"/><rect x="4" y="17" width="12" height="3" rx="1"/></svg>
    Chart</button>
  <button data-tab="summary" role="tab" aria-selected="false" aria-controls="view-summary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>
    Summary</button>
  <button data-tab="share" role="tab" aria-selected="false" aria-controls="view-share">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    Share</button>
</nav>
<div class="toast" id="toast"></div>
<div id="printReport" aria-hidden="true"></div>
<script>
/* DEMO BUILD — the only differences from index.html: this seed block and a
   separate storage key, so the demo NEVER touches (or shows) a family's real
   diary in the same browser. Regenerated by scripts/build.mjs — edit there. */
(function(){
  try{
    if (localStorage.getItem("peds-sleep-diary-demo-v1")) return;
    var today = new Date();
    function dAgo(k){
      var t = new Date(today.getFullYear(), today.getMonth(), today.getDate()-k);
      return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    }
    var demo = [
      {lo:"19:45",on:"20:10",wk:"06:20",ob:"06:35",aw:[{time:"01:30",dur:20,help:"room"}],naps:[{asleep:"12:55",dur:75,woke:"14:10"}]},
      {lo:"20:05",on:"20:50",wk:"06:05",ob:"06:25",aw:[{time:"00:45",dur:15,help:"fed"},{time:"03:20",dur:25,help:"bed"}],naps:[{asleep:"13:10",dur:70,woke:"14:20"}]},
      {lo:"19:50",on:"20:15",wk:"06:30",ob:"06:40",aw:[],naps:[{asleep:"12:50",dur:65,woke:"13:55"}]},
      {lo:"20:30",on:"21:15",wk:"06:15",ob:"06:45",aw:[{time:"02:10",dur:35,help:"bed"}],naps:[]},
      {lo:"19:40",on:"20:00",wk:"06:25",ob:"06:35",aw:[{time:"01:00",dur:10,help:"none"}],naps:[{asleep:"13:00",dur:90,woke:"14:30"}]},
      {lo:"20:00",on:"20:35",wk:"05:50",ob:"06:20",aw:[{time:"23:50",dur:15,help:"room"},{time:"03:40",dur:20,help:"room"}],naps:[{asleep:"13:25",dur:50,woke:"14:15"}]},
      {lo:"19:55",on:"20:20",wk:"06:10",ob:"06:30",aw:[],naps:[{asleep:"13:05",dur:80,woke:"14:25"}]}
    ];
    /* loggedAt: the morning after the night began (k = how many days late) */
    function loggedOn(date, late, hh, mm){
      var p = date.split("-").map(Number);
      return new Date(p[0], p[1]-1, p[2]+1+(late||0), hh, mm).toISOString();
    }

        awakenings:d.aw, naps:d.naps, notes: i===3 ? "Skipped nap at daycare; bedtime battle" : "",
        quality:demoQ[i], loggedAt:loggedOn(date, i===2 ? 1 : 0, 6, 50), napAsked:true };
      if (!d.naps.length) entries[date].noNap = true;
    });
    /* A made-up teenager (pick "Teen" under Setup > Child): the teen age band
       adds "Got into bed" and the second efficiency number. ib = got into
       bed; on most nights it is earlier than lights out. */
    var teen = [
      {ib:"22:15",lo:"23:10",on:"23:40",wk:"06:40",ob:"06:55",aw:[],q:3},
      {ib:"22:30",lo:"23:30",on:"00:05",wk:"06:40",ob:"06:50",aw:[],q:2},
      {ib:"22:45",lo:"22:45",on:"23:15",wk:"06:45",ob:"06:55",aw:[{time:"03:10",dur:15,help:"none"}],q:3},
      {ib:"21:50",lo:"23:20",on:"23:55",wk:"06:40",ob:"06:55",aw:[],q:2},
      {ib:"23:30",lo:"00:40",on:"01:05",wk:"09:50",ob:"10:30",aw:[],q:4},
      {ib:"23:45",lo:"00:55",on:"01:15",wk:"10:20",ob:"11:05",aw:[],q:5},
      {ib:"22:20",lo:"23:15",on:"00:10",wk:"06:40",ob:"06:55",aw:[{time:"04:30",dur:20,help:"none"}],q:2}
    ];
    var teenEntries = {};
    teen.forEach(function(d,i){
      var date = dAgo(teen.length - i);
      teenEntries[date] = { date:date, intoBed:d.ib, lightsOut:d.lo, onset:d.on, wake:d.wk, outOfBed:d.ob,
        awakenings:d.aw, naps: i===1 ? [{asleep:"16:20",dur:50,woke:"17:10"}] : [], napAsked:true, noNap: i!==1 && i!==5,
        notes: i===4 ? "Friday night; phone in bed" : "",
        quality:d.q, loggedAt:loggedOn(date, i===3 ? 2 : 0, i>=4 ? 11 : 7, 5) };

      meta:{ lastBackupAt:null }, drive:{ fileId:null, lastBackupAt:null } };

<script>
"use strict";

/* ============================================================
   Pediatric Sleep Diary — single-file web app (+ sw.js/manifest)
   Data model (v2): per child, one entry per calendar day D.
     - naps: naps taken during day D (before that night's bedtime)
     - night: the night of D (evening D -> morning D+1)
   All clock times are stored "HH:MM" (24h) and mapped onto a
   noon-to-noon axis: minutes-from-noon (mfn), 0 = 12:00 PM day D,
   1439 = 11:59 AM day D+1. Normal sleep never wraps this axis,
   so plain arithmetic means/SDs are valid.
   ============================================================ */

/* ---------- native shell (Capacitor) detection ----------
   The same file runs three ways: web page, installed PWA, and inside the
   Capacitor iOS/Android shell. Native-only features (reminder notifications,
   share sheet) feature-detect so the web build is untouched. */
const CAP = window.Capacitor;
const IS_NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
/* ?print — headless/report mode: build the physician report before the load
   event so Print-to-PDF (interactive or automated) captures it. */
const PRINT_MODE = /[?&]print\b/.test(location.search);
function capPlugin(name){
  return (IS_NATIVE && CAP.Plugins && CAP.Plugins[name]) ? CAP.Plugins[name] : null;
}

/* ---------- storage: IndexedDB primary, localStorage mirror ----------
   iOS evicts localStorage far more readily than IndexedDB; we write both
   and read whichever survives. navigator.storage.persist() asks the
   browser not to evict at all. */
const STORE_KEY = "peds-sleep-diary-demo-v1";
const IDB_NAME = "peds-sleep-diary", IDB_STORE = "kv";
function idbOpen(){
  return new Promise((res,rej)=>{
    const q = indexedDB.open(IDB_NAME, 1);
    q.onupgradeneeded = ()=> q.result.createObjectStore(IDB_STORE);
    q.onsuccess = ()=> res(q.result);
    q.onerror = ()=> rej(q.error);
  });
}
async function idbGet(k){
  const db = await idbOpen();
  try{
    return await new Promise((res,rej)=>{
      const t = db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(k);
      t.onsuccess = ()=>res(t.result==null? null : t.result);
      t.onerror = ()=>rej(t.error);
    });
  } finally { db.close(); }
}
async function idbSet(k,v){
  const db = await idbOpen();
  try{
    return await new Promise((res,rej)=>{
      const tx = db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(v,k);
      tx.oncomplete = ()=>res();
      tx.onerror = ()=>rej(tx.error);
    });
  } finally { db.close(); }
}
const KV = {
  async get(k){
    let idbVal = null;
    try { idbVal = await idbGet(k); } catch(e){}
    if (idbVal != null) return idbVal;
    try { return window.localStorage.getItem(k); } catch(e){ return null; }
  },
  async set(k,v){
    try { await idbSet(k,v); } catch(e){ console.error("idb.set",e); }
    try { window.localStorage.setItem(k,v); } catch(e){}
  }
};

/* ---------- state (v2: multiple children) ---------- */
let state = null;
function blankChild(){ return { settings:{ initials:"", ageBand:"", reporter:"" }, entries:{}, plan:null, planHistory:[], research:{ participantCode:"" }, sync:null }; }
function blankState(){
  return { version:2, activeChild:"c1", children:{ c1: blankChild() },
           meta:{ lastBackupAt:null, reminder:{ enabled:false, time:"07:00" } },
           drive:{ fileId:null, lastBackupAt:null } };
}
function migrateState(s){
  if (!s || typeof s!=="object") return blankState();
  if (s.version === 2){
    if (!s.children || !Object.keys(s.children).length) s.children = { c1: blankChild() };
    if (!s.children[s.activeChild]) s.activeChild = Object.keys(s.children)[0];
    if (!s.meta) s.meta = { lastBackupAt:null };
    if (!s.meta.reminder) s.meta.reminder = { enabled:false, time:"07:00" };
    if (!s.drive) s.drive = { fileId:null, lastBackupAt:null };
    Object.values(s.children).forEach(c=>{
      if (!c.settings) c.settings = { initials:"", ageBand:"" };
      if (c.settings.ageBand === undefined) c.settings.ageBand = "";
      if (c.settings.reporter === undefined) c.settings.reporter = "";
      if (!c.entries) c.entries = {};
      if (c.plan === undefined) c.plan = null;
      if (!Array.isArray(c.planHistory)) c.planHistory = [];
      if (!c.research) c.research = { participantCode:"" };
      if (c.sync === undefined) c.sync = null;
      if (c.sync && !Array.isArray(c.sync.pending)) c.sync.pending = [];
    });
    return s;
  }
  /* v1: { settings:{initials, driveFileId?, lastDriveBackup?}, entries:{} } */
  const out = blankState();
  out.children.c1.settings.initials = (s.settings && s.settings.initials) || "";
  out.children.c1.entries = s.entries || {};
  out.drive.fileId = (s.settings && s.settings.driveFileId) || null;
  out.drive.lastBackupAt = (s.settings && s.settings.lastDriveBackup) || null;
  return out;
}
async function loadState(){
  let parsed = null;
  if (PRINT_MODE){
    /* synchronous read so the report is ready before the load event */
    try { parsed = JSON.parse(window.localStorage.getItem(STORE_KEY)); } catch(e){}
  }
  if (!parsed){
    /* Read BOTH stores and keep the newer copy (by meta.savedAt): iOS can
       evict one store but not the other, and an interrupted write can leave
       IndexedDB one save behind localStorage. */
    let idbRaw = null, lsRaw = null;
    try { idbRaw = await idbGet(STORE_KEY); } catch(e){}
    try { lsRaw = window.localStorage.getItem(STORE_KEY); } catch(e){}
    const parse = r => { if (!r) return null; try { return JSON.parse(r); } catch(e){ return null; } };
    const a = parse(idbRaw), b = parse(lsRaw);
    const stamp = s => (s && s.meta && s.meta.savedAt) || "";
    parsed = (a && b) ? (stamp(b) > stamp(a) ? b : a) : (a || b);
  }
  state = migrateState(parsed);
}
let saveTimer = null;
function serializeState(){
  if (state.meta) state.meta.savedAt = new Date().toISOString();
  return JSON.stringify(state);
}
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; KV.set(STORE_KEY, serializeState()); }, 250);
}
/* A save debounced 250 ms ago is lost if the parent swipes the app away
   first — flush it the moment the page is hidden (localStorage write is
   synchronous, so it lands even as the page dies). */
function flushSave(){
  if (!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  KV.set(STORE_KEY, serializeState());
}
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "hidden") flushSave(); });
function cur(){ return state.children[state.activeChild]; }

/* ---------- recommended sleep duration by age ----------
   American Academy of Sleep Medicine consensus statement, endorsed by the
   American Academy of Pediatrics: Paruthi S, et al. J Clin Sleep Med
   2016;12(6):785-786. Hours per 24 h (naps included for the youngest).
   Two groups fall outside that statement:
     - 0-3 months: the AASM makes no recommendation, so the National Sleep
       Foundation range is used (Hirshkowitz et al., Sleep Health 2015;
       re-certified by Dzierzewski et al., Sleep Health 2026).
     - over 18: the AASM/Sleep Research Society adult statement, "7 or more
       hours" (Watson et al., Sleep 2015;38(6):843-844) — no upper bound.
   recLo/recHi = recommended hours; recHi null = no upper bound. flagHi is
   only for the entry form's plausibility note where recHi is null. */
const CITE_AASM = "American Academy of Sleep Medicine consensus statement, endorsed by the American Academy of Pediatrics (Paruthi et al., J Clin Sleep Med 2016;12(6):785–786).";
const AGE_BANDS = {
  newborn:   { label:"Newborn (0–3 months)",     recLo:14, recHi:17,
               cite:"The AASM makes no recommendation under 4 months; this range is from the National Sleep Foundation (Hirshkowitz et al., Sleep Health 2015;1(1):40–43; re-certified Dzierzewski et al., Sleep Health 2026)." },
  infant:    { label:"Infant (4–12 months)",      recLo:12, recHi:16, cite:CITE_AASM },
  toddler:   { label:"Toddler (1–2 years)",       recLo:11, recHi:14, cite:CITE_AASM },
  preschool: { label:"Preschooler (3–5 years)",   recLo:10, recHi:13, cite:CITE_AASM },
  school:    { label:"School age (6–12 years)",   recLo:9,  recHi:12, cite:CITE_AASM },
  teen:      { label:"Teenager (13–18 years)",    recLo:8,  recHi:10, cite:CITE_AASM },
  youngadult:{ label:"Young adult (19–25 years)", recLo:7,  recHi:null, flagHi:9,
               cite:"AASM and Sleep Research Society consensus statement for adults (Watson et al., Sleep 2015;38(6):843–844)." }
};
/* Classify mean 24-h sleep (minutes) against the recommended range for the
   child's age group: within, below or above. */
function sleepNeedCompare(tst24min){
  const band = AGE_BANDS[cur().settings.ageBand];
  if (!band || isNaN(tst24min)) return null;
  const h = tst24min/60;
  const range = band.recHi == null ? band.recLo+" h or more" : band.recLo+"–"+band.recHi+" h";
  let cls, text;
  if (h < band.recLo){
    cls = "may"; text = "Below the recommended range ("+range+") for this age.";
  } else if (band.recHi != null && h > band.recHi){
    cls = "may"; text = "Above the recommended range ("+range+") for this age.";
  } else {
    cls = "ok";  text = "Within the recommended range ("+range+") for this age.";
  }
  return { cls, text, band };
}

/* ---------- who the diary is for / who fills it in (ROADMAP D1) ----------
   "Got into bed" and the second efficiency number are shown for the
   Teenager and Young adult age bands only. Who fills the diary in is asked
   once per diary in Setup and stored in settings.reporter; "" means "follow
   the age band" (teen bands -> teen, everyone else -> parent). */
function isTeenBand(){
  const b = cur().settings.ageBand;
  return b === "teen" || b === "youngadult";
}
function reporter(){
  const r = cur().settings.reporter;
  return (r === "teen" || r === "parent") ? r : (isTeenBand() ? "teen" : "parent");
}
/* Sleep quality: CSD Core item 8 anchors, stored as 1–5 in entry.quality. */
const QUALITY_LABELS = ["Very poor","Poor","Fair","Good","Very good"];
function qualityQuestion(){
  return reporter() === "teen" ? "How would you rate the quality of your sleep?"
                               : "How did your child sleep last night?";
}

/* ---------- time helpers ---------- */
function hm(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }           // minutes from midnight
function hmAdd(t, mins){                                                        // "HH:MM" + minutes -> "HH:MM"
  const m = (((hm(t) + Math.round(mins)) % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}
function hmElapsed(a, b){ return ((hm(b) - hm(a)) + 1440) % 1440; }             // clock minutes from a to b
function mfn(t){ return ((hm(t) - 720) + 1440) % 1440; }                          // minutes from noon
function clock(mfnVal){                                                            // mfn -> "h:mm AM/PM"
  let m = ((Math.round(mfnVal) % 1440)+1440)%1440;
  let mm = (m + 720) % 1440;
  let h = Math.floor(mm/60), min = mm%60;
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12===0) h12 = 12;
  return h12 + ":" + String(min).padStart(2,"0") + " " + ap;
}
function clockFromHM(t){ return clock(mfn(t)); }
function dur(mins){
  if (isNaN(mins)) return "—";
  mins = Math.round(mins);
  if (mins < 0) mins = 0;
  const h = Math.floor(mins/60), m = mins%60;
  if (h===0) return m + " min";
  return h + " h " + (m? m+" min" : "");
}
/* Nap length in minutes. Naps entered before the duration field existed only
   carry asleep/woke, so fall back to the elapsed clock time between them. */
function napDur(n){
  if (n.dur !== undefined && n.dur !== "" && n.dur !== null) return String(n.dur);
  if (n.asleep && n.woke) return String(hmElapsed(n.asleep, n.woke));
  return "";
}
/* "inBed/asleep-woke/outOfBed" for the exports; the in-bed pair only exists on
   naps entered before the duration field, so drop it when it is empty. */
function napDetail(n){
  const core = (n.asleep||"")+"-"+(n.woke||"");
  return (n.inBed || n.out) ? (n.inBed||"")+"/"+core+"/"+(n.out||"") : core;
}
function isoToday(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){
  const [y,mo,d]=iso.split("-").map(Number);
  const dt = new Date(y,mo-1,d);
  return dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function fmtDateShort(iso){
  const [y,mo,d]=iso.split("-").map(Number);
  return new Date(y,mo-1,d).toLocaleDateString(undefined,{month:"numeric",day:"numeric"});
}
function addDays(iso, k){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d + k);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function mean(a){ return a.length ? a.reduce((s,x)=>s+x,0)/a.length : NaN; }
function sd(a){
  if (a.length < 2) return NaN;
  const m = mean(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));
}

/* ---------- per-night computation ---------- */
const HELP_LABELS = {
  none:"No help needed", room:"Comforted in room", fed:"Fed",
  bed:"Brought to parents' bed", other:"Other"
};
/* Where a nap falls on the diary's noon-to-noon rows. Naps are stored with
   the calendar day they happened on (entry D), but row D runs from noon on
   D to noon on D+1 — so a nap before noon belongs at the right-hand end of
   the PREVIOUS day's row, and a nap that runs through noon is split across
   the two rows. Returns [{prev, a, b}] in minutes-from-noon of the row;
   prev:true = the row of the day before. A nap with no positive length, or
   longer than 12 h (end typed before start), has no pieces. */
function napLen(n){
  if (!(n.asleep && n.woke)) return 0;
  const len = hmElapsed(n.asleep, n.woke);
  return (len > 0 && len <= 720) ? len : 0;
}
function napPieces(n){
  const len = napLen(n), out = [];
  if (!len) return out;
  const p = hm(n.asleep) - 720, q = p + len;
  if (p < 0) out.push({ prev:true,  a:p + 1440, b:Math.min(q, 0) + 1440 });
  if (q > 0) out.push({ prev:false, a:Math.max(p, 0), b:q });
  return out;
}
function computeNight(e){
  const out = { valid:false, warnings:[] };
  if (!(e.lightsOut && e.onset && e.wake && e.outOfBed)) return out;
  const lo = mfn(e.lightsOut), on = mfn(e.onset), wk = mfn(e.wake), ob = mfn(e.outOfBed);
  if (on < lo) out.warnings.push("Sleep onset is before lights out.");
  if (wk <= on) out.warnings.push("Morning wake time is not after sleep onset.");
  if (ob < wk) out.warnings.push("Out of bed is before final wake time.");
  /* Clip each awakening to the sleep window [onset, wake] so TST agrees
     with the chart and raster (an awakening logged outside the window —
     usually a typo — no longer subtracts from sleep). Untimed awakenings
     (old data) still count in full. */
  const waso = (e.awakenings||[]).reduce((s,a)=>{
    const d = Number(a.dur)||0;
    if (!a.time) return s + d;
    const t = mfn(a.time);
    return s + Math.max(0, Math.min(t + d, wk) - Math.max(t, on));
  }, 0);
  const nAw = (e.awakenings||[]).length;
  const nHelp = (e.awakenings||[]).filter(a=> a.help && a.help!=="none").length;
  const tib = ob - lo;
  const sol = on - lo;
  const spt = wk - on;                      // sleep period time
  const tst = Math.max(0, spt - waso);      // night total sleep time
  const se  = tib > 0 ? (tst / tib) * 100 : NaN;
  const mid = on + spt/2;                   // midsleep, mfn
  // naps
  let napSleep = 0, napInBed = 0, nNaps = 0;
  (e.naps||[]).forEach(n=>{
    if (n.asleep && n.woke){
      /* clock length, so a morning nap that runs past noon counts whole
         (it used to need splitting at noon by hand) */
      const len = napLen(n);
      if (len){ napSleep += len; nNaps++; }
      else out.warnings.push("A nap ends at or before it starts.");
    }
    if (n.inBed && n.out){
      const i = mfn(n.inBed), o = mfn(n.out);
      if (o > i) napInBed += (o - i);
    }
  });
  Object.assign(out,{ valid:true, lo,on,wk,ob, tib,sol,spt,tst,se,waso,nAw,nHelp,mid,
                      napSleep, napInBed, nNaps, tst24: tst + napSleep });
  return out;
}

/* "SE from getting into bed" (ROADMAP 1.2, teen bands only): the same
   night sleep, divided by got-into-bed -> out-of-bed instead of lights-out ->
   out-of-bed. Kept out of computeNight() so that math stays untouched; a
   night with no intoBed time (or a non-teen diary) simply has no second
   number. */
function bedMetrics(e, c){
  if (!c || !c.valid || !e.intoBed || !isTeenBand()) return null;
  const ib = mfn(e.intoBed);
  if (ib > c.lo) return { ib, late:true, tibBed:NaN, seBed:NaN };
  const tibBed = c.ob - ib;
  return { ib, late:false, tibBed, seBed: tibBed > 0 ? (c.tst / tibBed) * 100 : NaN };
}
/* loggedAt (ROADMAP 1.5): set silently the first time a night is saved.
   Lag = whole calendar days between the evening the night began and the
   local day it was logged; 1 = logged the day the child woke up. */
function localIso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function logInfo(e){
  if (!e.loggedAt) return null;
  const d = new Date(e.loggedAt);
  if (isNaN(d.getTime())) return null;
  return { lag: daysFrom(e.date, localIso(d)), beforeNoon: d.getHours() < 12,
           local: localIso(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") };
}
function loggingStats(entries){
  const infos = entries.map(logInfo);
  const stamped = infos.filter(Boolean);
  if (!stamped.length) return null;
  const next = stamped.filter(i=> i.lag === 1);
  return { stamped: stamped.length, unstamped: infos.length - stamped.length,
           nextDay: next.length, nextMorning: next.filter(i=> i.beforeNoon).length,
           later: stamped.filter(i=> i.lag > 1).length };
}
function napLine(s){
  if (!s.naps.asked) return "";
  return "Naps answered on "+s.naps.known+" of "+s.n+" days"
       + (s.naps.unknown ? "; nap and 24-hour averages use those days only." : ".");
}
function loggingLine(st){
  if (!st) return "";
  let t = st.nextDay+" of "+st.stamped+" night"+(st.stamped===1?"":"s")+" logged the next day"
        + (st.nextDay ? " ("+st.nextMorning+" before noon)" : "");
  if (st.later) t += "; "+st.later+" logged two or more days later";
  if (st.unstamped) t += "; "+st.unstamped+" with no log time recorded";
  return t + ".";
}
/* Age-aware plausibility notes (ROADMAP 1.4): shown inline while the parent
   types, never blocking. "Far outside" = more than 2 h beyond the
   recommended range for the age group (AGE_BANDS), for the 24-hour total —
   night sleep plus the naps logged for that day. */
const FAR_HOURS = 2;
function plausibilityNotes(e){
  const notes = [];
  const c = computeNight(e);
  const band = AGE_BANDS[cur().settings.ageBand];
  const baby = cur().settings.ageBand === "newborn" || cur().settings.ageBand === "infant";
  const naps = (e.naps||[]).filter(n=> napLen(n));
  const pieces = naps.flatMap(napPieces);
  if (c.valid && !c.warnings.length){
    if (band){
      const h = c.tst24/60;
      if (h < band.recLo - FAR_HOURS)
        notes.push("This adds up to "+dur(c.tst24)+" of sleep in 24 hours — much less than usual for this age group. If that's what happened, leave it.");
      else if (h > (band.recHi != null ? band.recHi : band.flagHi) + FAR_HOURS)
        notes.push("This adds up to "+dur(c.tst24)+" of sleep in 24 hours — much more than usual for this age group. If that's what happened, leave it.");
    }
    if (c.sol > 180)
      notes.push("It took "+dur(c.sol)+" to fall asleep. Check lights out and fell asleep (AM/PM).");
    if (pieces.some(x=> !x.prev && x.b > c.lo && x.a < c.ob))
      notes.push("A nap overlaps the night's time in bed. Check the nap time (AM/PM).");
    if ((e.awakenings||[]).some(a=> a.time && (mfn(a.time) < c.on || mfn(a.time) >= c.wk)))
      notes.push("An awakening is outside the night's sleep (before falling asleep or after waking for the day), so it isn't counted. Check its time.");
    const b = bedMetrics(e, c);
    if (b && b.late)
      notes.push("Got into bed is after lights out. Check those two times.");
    else if (b && c.lo - b.ib > 240)
      notes.push("Got into bed is "+dur(c.lo - b.ib)+" before lights out. Check those two times.");
  }
  /* a morning nap sits at the end of the night before — check it against
     that night's time in bed when that night is in the diary */
  const before = e.date ? cur().entries[addDays(e.date, -1)] : null;
  const cb = before ? computeNight(before) : null;
  if (cb && cb.valid && pieces.some(x=> x.prev && x.a < cb.ob && x.b > cb.lo))
    notes.push("A morning nap starts before the child was out of bed that morning ("+clock(cb.ob)+"). Check the nap time.");
  const small = naps.find(n=> hm(n.asleep) < 300);
  if (small)
    notes.push("A nap at "+clockFromHM(small.asleep)+" is in the middle of the night. Check AM/PM.");
  if (naps.some(n=> napLen(n) > (baby ? 300 : 240)))
    notes.push("One nap is over "+(baby ? 5 : 4)+" hours long. Check the minutes.");
  return notes;
}

/* ---------- the nap question (ROADMAP 1.9) ----------
   An empty nap list used to mean both "no nap" and "forgot to log it".
   Children who usually nap are now offered one-tap answers in the entry
   form, and the entry remembers that it was asked (napAsked) and whether the
   parent said "no nap" (noNap). Status per entry:
     "nap"     — at least one nap recorded
     "none"    — parent tapped "No nap"
     "unknown" — asked, not answered: left out of the nap averages
     "notasked"— not asked (older entries, non-nappers): counts as zero, as before */
const NAP_ASK_BANDS = { newborn:1, infant:1, toddler:1, preschool:1, teen:1, youngadult:1 };  // not school age
const NAP_LOOKBACK = 7, NAP_MIN_DAYS = 3;
function napStatus(e){
  if ((e.naps||[]).some(n=> n.asleep && n.woke)) return "nap";
  if (e.noNap) return "none";
  return e.napAsked ? "unknown" : "notasked";
}
/* Should the form ask, and what is this child's usual nap? Learned from the
   last 7 logged days before dateIso (a nap on 3 or more = "usually naps");
   until there are 7, the age group decides. Usual naps = the median start
   and length of the 1st, 2nd, … nap of the day across those nap days. */
function napHabit(dateIso){
  const prior = sortedEntries().filter(x=> x.date < dateIso).slice(-NAP_LOOKBACK);
  const napDays = prior.map(x=> (x.naps||[]).filter(n=> n.asleep && n.woke && Number(napDur(n)) > 0)
                                  .sort((a,b)=> hm(a.asleep) - hm(b.asleep)))
                       .filter(list=> list.length);
  const learned = napDays.length >= NAP_MIN_DAYS;
  const ask = learned || (prior.length < NAP_LOOKBACK && !!NAP_ASK_BANDS[cur().settings.ageBand]);
  const med = a => { const v = a.slice().sort((x,y)=>x-y), m = Math.floor(v.length/2); return v.length%2 ? v[m] : (v[m-1]+v[m])/2; };
  const usual = [];
  if (learned){
    const perDay = Math.max(1, Math.round(med(napDays.map(l=> l.length))));
    for (let k=0; k<perDay; k++){
      const kth = napDays.filter(l=> l.length > k).map(l=> l[k]);
      if (!kth.length) break;
      const start = Math.round(med(kth.map(n=> hm(n.asleep)))/5)*5;
      const mins = Math.round(med(kth.map(n=> Number(napDur(n))))/5)*5;
      const asleep = hmAdd("00:00", start);
      usual.push({ asleep, dur: mins, woke: hmAdd(asleep, mins) });
    }
  }
  return { ask, usual };
}

function sortedEntries(){
  return Object.values(cur().entries).sort((a,b)=> a.date < b.date ? -1 : 1);
}

/* ---------- summary across nights ---------- */
function computeSummary(){
  const rows = sortedEntries().map(e=>({e, c:computeNight(e)})).filter(r=>r.c.valid);
  if (!rows.length) return null;
  rows.forEach(r=>{ r.b = bedMetrics(r.e, r.c); });
  const seBed = rows.filter(r=> r.b && !isNaN(r.b.seBed)).map(r=> r.b.seBed);
  const rated = rows.filter(r=> r.e.quality >= 1 && r.e.quality <= 5);
  const g = k => rows.map(r=>r.c[k]);
  const napKnown = rows.filter(r=> napStatus(r.e) !== "unknown");
  const gk = k => napKnown.map(r=>r.c[k]);
  const s = {
    n: rows.length,
    first: rows[0].e.date, last: rows[rows.length-1].e.date,
    lightsOut:{ m:mean(g("lo")), sd:sd(g("lo")) },
    onset:{ m:mean(g("on")), sd:sd(g("on")) },
    wake:{ m:mean(g("wk")), sd:sd(g("wk")) },
    outOfBed:{ m:mean(g("ob")), sd:sd(g("ob")) },
    mid:{ m:mean(g("mid")), sd:sd(g("mid")) },
    sol:{ m:mean(g("sol")), sd:sd(g("sol")) },
    tib:{ m:mean(g("tib")) },
    tst:{ m:mean(g("tst")), sd:sd(g("tst")) },
    se:{ m:mean(g("se")), sd:sd(g("se")) },
    waso:{ m:mean(g("waso")) },
    nAw:{ m:mean(g("nAw")), tot: g("nAw").reduce((a,b)=>a+b,0) },
    nHelp:{ m:mean(g("nHelp")), tot: g("nHelp").reduce((a,b)=>a+b,0) },
    /* days where the nap question went unanswered are left out of the nap
       and 24-hour averages (for older diaries napKnown is every row) */
    napSleep:{ m:mean(gk("napSleep")) },
    nNaps:{ m:mean(gk("nNaps")) },
    tst24:{ m:mean(gk("tst24")) },
    naps:{ asked: rows.filter(r=> r.e.napAsked).length, known: napKnown.length,
           unknown: rows.length - napKnown.length },
    /* Phase 1 additions — all optional, absent data leaves them empty */
    teen: isTeenBand(),
    seBed:{ m:mean(seBed), n:seBed.length },
    quality:{ n:rated.length, counts:[1,2,3,4,5].map(q=> rated.filter(r=> r.e.quality === q).length) },
    logging: loggingStats(rows.map(r=>r.e)),
    rows
  };
  return s;
}

/* ---------- sleep/wake raster + Sleep Regularity Index ----------
   Build a 5-min-resolution sleep(1)/wake(0) vector per diary day
   (noon->noon, 288 epochs), from night sleep minus awakenings, plus naps.
   SRI compares consecutive calendar days epoch-by-epoch:
   SRI = -100 + 200 * P(same state at same clock time on consecutive days). */
const EPOCH = 5, NEP = 1440/EPOCH;
function rasterFor(e){
  const c = computeNight(e);
  if (!c.valid) return null;
  const v = new Array(NEP).fill(0);
  const set = (a,b,val)=>{
    let i0 = Math.max(0, Math.floor(a/EPOCH)), i1 = Math.min(NEP, Math.ceil(b/EPOCH));
    for (let i=i0;i<i1;i++) v[i]=val;
  };
  set(c.on, c.wk, 1);
  (e.awakenings||[]).forEach(a=>{
    if (a.time && a.dur){ const t = mfn(a.time); set(t, t + Number(a.dur), 0); }
  });
  /* naps are laid onto the rasters in computeSRI(): a morning nap belongs
     to the previous day's noon-to-noon vector */
  return v;
}
function computeSRI(){
  const byDate = {};
  sortedEntries().forEach(e=>{ const r = rasterFor(e); if (r) byDate[e.date] = r; });
  sortedEntries().forEach(e=> (e.naps||[]).flatMap(napPieces).forEach(x=>{
    const v = byDate[x.prev ? addDays(e.date, -1) : e.date];
    if (!v) return;
    for (let i=Math.max(0, Math.floor(x.a/EPOCH)); i<Math.min(NEP, Math.ceil(x.b/EPOCH)); i++) v[i] = 1;
  }));
  let same=0, total=0;
  Object.keys(byDate).forEach(d=>{
    const nx = byDate[addDays(d,1)];
    if (!nx) return;
    const cur = byDate[d];
    for (let i=0;i<NEP;i++){ if (cur[i]===nx[i]) same++; total++; }
  });
  if (!total) return null;
  return -100 + 200*(same/total);
}
/* ---------- clinician sleep plan (QR/link capsule) ----------
   A plan arrives as #plan=<base64url(JSON)> in the URL fragment — created
   by plan.html (or a rehosted copy) and never sent to any server. It is
   display-only: targets, an optional stepped schedule, a checklist, a note.
   The fade math mirrors plan.html's fadeInfo(); keep the two in sync. */
function decodePlanParam(b64){
  try{
    const raw = b64.replace(/-/g,"+").replace(/_/g,"/");
    const p = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (p && p.v===1 && p.start && p.targets && (p.targets.bedtime || p.targets.wake)) return p;
  }catch(err){}
  return null;
}
function daysFrom(aIso,bIso){
  const u = s=>{ const [y,m,d]=s.split("-").map(Number); return Date.UTC(y,m-1,d); };
  return Math.round((u(bIso)-u(aIso))/86400000);
}
function clockMin(m){ return clock(((m-720)%1440+1440)%1440); } // minutes-from-midnight -> h:mm AM/PM
function planWho(plan){
  return ((plan.from && plan.from.name) || "your clinician")
       + (plan.from && plan.from.role ? " ("+plan.from.role+")" : "");
}
/* Tonight's computed targets for the night beginning on dateIso.
   Night 1 = plan.start. Weekend targets apply to Fri/Sat evenings. */
function planTargets(plan, dateIso){
  if (!plan || !plan.start || !dateIso) return null;
  const n = daysFrom(plan.start, dateIso) + 1;
  if (n < 1) return null;
  const t = plan.targets || {};
  const [y,mo,d] = dateIso.split("-").map(Number);
  const dow = new Date(y,mo-1,d).getDay();
  const wknd = (dow===5 || dow===6);
  let bed  = (wknd && t.weekendBedtime) ? hm(t.weekendBedtime) : (t.bedtime ? hm(t.bedtime) : null);
  let wake = (wknd && t.weekendWake)    ? hm(t.weekendWake)    : (t.wake    ? hm(t.wake)    : null);
  const f = plan.fade;
  if (f && f.from && bed!=null){
    const from = hm(f.from), step = Number(f.stepMin)||15, every = Number(f.everyNights)||3;
    if (f.mode === "delay"){
      /* chronotherapy: bedtime moves LATER around the clock; the whole
         sleep window shifts, so wake follows bedtime until the target */
      const delta = (((bed-from)%1440)+1440)%1440 || 1440;
      const shift = Math.min(delta, Math.floor((n-1)/every)*step);
      const b2 = (from+shift)%1440;
      if (wake!=null){ const durS = ((wake-bed)%1440+1440)%1440; wake = (b2+durS)%1440; }
      bed = b2;
    } else {
      const dir = bed<from ? -1 : 1;
      const shift = Math.floor((n-1)/every)*step*dir;
      bed = dir<0 ? Math.max(bed, from+shift) : Math.min(bed, from+shift);
    }
  }
  return { n, bed, wake };
}
/* Checklist adherence + mean lights-out deviation across plan nights. */
function planAdherence(){
  const plan = cur().plan;
  if (!plan) return null;
  const rows = sortedEntries().filter(e=> daysFrom(plan.start, e.date) >= 0);
  if (!rows.length) return null;
  const items = (plan.checklist||[]).map(it=>({
    label: it.label,
    done: rows.filter(e=> e.adherence && e.adherence[it.id]).length,
    of: rows.length
  }));
  const devs = [];
  rows.forEach(e=>{
    const t = planTargets(plan, e.date);
    if (t && t.bed!=null && e.lightsOut){
      let dv = hm(e.lightsOut) - t.bed;
      if (dv > 720) dv -= 1440; if (dv < -720) dv += 1440; // shortest signed distance
      devs.push(dv);
    }
  });
  return { nights: rows.length, items, bedDev: devs.length ? mean(devs) : NaN };
}

/* ============================================================
   UI
   ============================================================ */
const $ = sel => document.querySelector(sel);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k==="class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (k==="html") n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(k=>{ if (k==null) return; n.append(k.nodeType? k : document.createTextNode(k)); });
  return n;
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------- tabs ---------- */
function switchTab(name){
  document.querySelectorAll("nav.tabs button").forEach(x=>{
    const on = x.dataset.tab === name;
    x.classList.toggle("active", on);
    x.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#view-"+name).classList.add("active");
  render(name);
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click", ()=> switchTab(b.dataset.tab));
});

function render(tab){
  if (!tab) tab = document.querySelector("nav.tabs button.active").dataset.tab;
  $("#hdrSub").textContent = headerSub();
  if (tab==="diary") renderDiary();
  if (tab==="chart") renderChart();
  if (tab==="summary") renderSummary();
  if (tab==="share") renderShare();
}
function headerSub(){
  const n = sortedEntries().length;
  const who = cur().settings.initials ? "Child: "+cur().settings.initials+" · " : "";
  return who + (n ? n + (n===1?" night":" nights") + " recorded" : "Track your child's sleep, night by night");
}

/* ---------- native: daily reminder notification ----------
   Local-only (no server): the shell schedules a repeating notification on
   the phone itself. No-op on the web / PWA builds. */
async function applyReminder(){
  const LN = capPlugin("LocalNotifications");
  if (!LN) return;
  const r = state.meta.reminder;
  try { await LN.cancel({ notifications:[{ id:1 }] }); } catch(e){}
  if (!r.enabled) return;
  const perm = await LN.requestPermissions();
  if (!perm || perm.display !== "granted"){
    r.enabled = false; saveState();
    toast("Notifications are blocked for this app");
    return;
  }
  const [h,m] = (r.time||"07:00").split(":").map(Number);
  await LN.schedule({ notifications:[{
    id:1,
    title:"Sleep diary",
    body:"Add last night — it takes about a minute.",
    schedule:{ on:{ hour:h, minute:m }, allowWhileIdle:true }
  }]});
}

/* ---------- native: share a file via the OS share sheet ----------
   Blob-anchor downloads don't work inside the native webview; write the
   file to the app cache and hand it to the share sheet instead.
   Returns false on web so callers fall back to the download link. */
async function shareFileNative(filename, data){
  const FS = capPlugin("Filesystem"), SH = capPlugin("Share");
  if (!FS || !SH) return false;
  const res = await FS.writeFile({ path:filename, data, directory:"CACHE", encoding:"utf8" });
  await SH.share({ title:filename, url:res.uri });
  return true;
}

/* ---------- install prompt ----------
   Android/Chrome fires beforeinstallprompt, letting us offer a one-tap
   install. iOS has no install API — Apple requires the manual
   Share → Add to Home Screen, so we show instructions instead. */
let installPromptEvent = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPromptEvent = e;
  const onDiary = document.querySelector("nav.tabs button.active")?.dataset.tab === "diary";
  if (onDiary && !editing) renderDiary();
});
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;
}
function installBanner(){
  if (IS_NATIVE || isStandalone() || state.meta.installDismissed) return null;
  const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const b = el("div",{class:"banner"});
  b.append(el("b",null,"Add this diary to your home screen. "),
    "It becomes an app icon, works without internet, and keeps your entries safe on this phone.");
  const row = el("div",{style:"display:flex;gap:8px"});
  if (installPromptEvent){
    row.append(el("button",{class:"btn-primary",style:"width:auto",onclick:async()=>{
      const evt = installPromptEvent; installPromptEvent = null;
      try { await evt.prompt(); } catch(e){}
      renderDiary();
    }},"Install app"));
  } else if (isiOS){
    b.append(el("div",{class:"hint",style:"margin-top:6px"},
      "Tap the Share button (the square with an arrow, at the bottom of Safari), scroll down, and choose “Add to Home Screen.”"));
    /* iOS gives the installed app its own storage container — nights logged
       in Safari do NOT appear in it. Backup file is the bridge. */
    if (sortedEntries().length){
      b.append(el("div",{class:"hint",style:"margin-top:6px"},
        el("b",null,"Already logged nights here? "),
        "Save a backup file first (Share tab) — the installed app starts empty on iPhone — then use “Restore from file” inside it."));
    }
  } else {
    b.append(el("div",{class:"hint",style:"margin-top:6px"},
      "In your browser's menu, choose “Add to Home Screen” or “Install app.”"));
  }
  row.append(el("button",{class:"btn-secondary",onclick:()=>{
    state.meta.installDismissed = true; saveState(); renderDiary();
  }},"Not now"));
  b.append(row);
  return b;
}

/* ---------- diary view ---------- */
let editing = null;      // date being edited, or "__new__"
let newEntryDate = null; // preset date when adding a missed night
let pendingPlan = null;  // decoded #plan= capsule awaiting the family's accept

function planOfferCard(){
  const p = pendingPlan;
  const c = el("div",{class:"card tint"});
  c.append(el("h2",null,"Sleep plan received", el("span",{class:"big"},"From "+planWho(p))));
  const t = planTargets(p, p.start) || {};
  const bits = [];
  if (t.bed!=null)  bits.push("bedtime "+clockMin(t.bed));
  if (t.wake!=null) bits.push("wake "+clockMin(t.wake));
  c.append(el("div",null,"Starts "+fmtDate(p.start)+(bits.length? " — night 1: "+bits.join(" · ") : "")));
  if (p.fade && p.fade.from)
    c.append(el("div",{class:"hint"},"The bedtime target moves step by step — the diary shows each night's target automatically."));
  if ((p.checklist||[]).length)
    c.append(el("div",{class:"hint"},"Nightly checklist: "+p.checklist.map(i=>i.label).join(" · ")));
  if (p.note) c.append(el("div",{class:"hint",style:"font-style:italic"},"“"+p.note+"”"));
  const who = cur().settings.initials;
  c.append(el("div",{class:"hint"},
    "Adding it attaches the plan to "+(who? who+"'s diary" : "the child selected in Setup below")+
    " on this phone. It only changes what's shown while you log — never your entries, and nothing is uploaded."));
  c.append(el("div",{class:"btn-row"},
    el("button",{class:"btn-secondary",onclick:()=>{ pendingPlan=null; renderDiary(); }},"Not now"),
    el("button",{class:"btn-primary",onclick:()=>{
      const ch = cur();
      if (ch.plan){ ch.planHistory = ch.planHistory||[]; ch.planHistory.push(ch.plan); }
      ch.plan = pendingPlan; pendingPlan = null;
      saveState(); toast("Plan added"); renderDiary();
    }},"Add this plan")
  ));

}
function planCard(){
  const p = cur().plan;
  const c = el("div",{class:"card"});
  c.append(el("h2",null,"Sleep plan", el("span",{class:"big"},"From "+planWho(p))));
  const t = planTargets(p, isoToday());
  if (t){
    const bits=[];
    if (t.bed!=null)  bits.push("bedtime "+clockMin(t.bed));
    if (t.wake!=null) bits.push("wake "+clockMin(t.wake));
    c.append(el("div",null, el("b",null,"Tonight (night "+t.n+"): "), bits.join(" · ")));
  } else {
    c.append(el("div",{class:"hint"},"Starts "+fmtDate(p.start)+"."));
  }
  if (p.review) c.append(el("div",{class:"hint"},"Review visit: "+fmtDate(p.review)));
  if (p.note) c.append(el("div",{class:"hint",style:"font-style:italic"},"“"+p.note+"”"));
  c.append(el("button",{class:"btn-danger",style:"margin-top:6px;padding-left:0",onclick:()=>{
    if (confirm("Remove this plan from the diary? Your recorded nights are not affected.")){
      const ch=cur(); ch.planHistory=ch.planHistory||[]; ch.planHistory.push(ch.plan); ch.plan=null;
      saveState(); renderDiary(); toast("Plan removed");
    }
  }},"Remove this plan…"));
  return c;
}

function missingNights(){
  const entries = sortedEntries();
  if (!entries.length) return [];
  const yesterday = addDays(isoToday(), -1);
  const out = [];
  let d = entries[0].date;
  const end = yesterday > entries[entries.length-1].date ? yesterday : entries[entries.length-1].date;
  while (d <= end){
    if (!cur().entries[d]) out.push(d);
    d = addDays(d, 1);
  }
  return out;
}
function backupDue(){
  const n = sortedEntries().length;
  if (n < 3) return false;
  const stamps = [state.meta.lastBackupAt, state.drive.lastBackupAt].filter(Boolean);
  if (!stamps.length) return true;
  const latest = stamps.sort().pop();
  return (Date.now() - new Date(latest).getTime()) > 7*24*3600*1000;
}

function renderDiary(){
  const v = $("#view-diary"); v.innerHTML = "";
  if (editing){
    const preset = newEntryDate; newEntryDate = null;
    v.append(entryForm(editing === "__new__" ? null : cur().entries[editing], preset));
    return;
  }

  /* clinician plan arriving via link — the family decides */
  if (pendingPlan) v.append(planOfferCard());

  /* consultant sharing invitation (#connect= link) — the family decides */
  if (pendingConnect) v.append(connectOfferCard());

  /* install prompt (browser only; hidden once installed or dismissed) */
  const inst = installBanner();
  if (inst) v.append(inst);

  /* backup nudge */
  if (backupDue()){
    v.append(el("div",{class:"banner"},
      el("b",null,"Protect your diary. "),
      "You have "+sortedEntries().length+" nights recorded and no recent backup. A backup keeps your data safe if this browser's storage is cleared.",
      el("div",null, el("button",{class:"btn-secondary",onclick:()=>switchTab("share")},"Back up now"))
    ));
  }

  /* child / setup card */
  const ids = Object.keys(state.children);
  const setup = el("div",{class:"card"});
  setup.append(el("h2",null,"Setup"));
  if (ids.length > 1 || true){
